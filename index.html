    const sanitizePhoneForMeta = (rawPhone) => {
      if (!rawPhone) return '';
      let digits = String(rawPhone).replace(/[^\d]/g, '');
      if (digits.startsWith('00')) digits = digits.slice(2);
      if (digits.length === 9 && (digits.startsWith('6') || digits.startsWith('7'))) {
        digits = '34' + digits;
      }
      return digits;
    };

    // Sintetizador de sonido para notificaciones en tiempo real
    const playNotificationSound = (type = 'default') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'completed') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (type === 'removed') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(311.13, now + 0.14);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    };

      const mIndex = MONTH_NAMES.findIndex(m => m.toLowerCase() === parts[0].toLowerCase());

    const formatDuration = (ms) => {
      if (!ms || ms <= 0) return 'N/D';
      const mins = Math.max(1, Math.floor(ms / 60000));
      const hrs = Math.floor(mins / 60);
      const remMins = mins % 60;
      if (hrs === 0) return `${remMins}m`;
      return `${hrs}h ${remMins}m`;
    };

    const getMissionEffectiveWorkMs = (m, nowTs = Date.now()) => {
      const baseAccumulated = Number(m.accumulatedWorkMs) || 0;
      if (m.status === 'En Progreso' && m.lastResumedAt) {
        return baseAccumulated + Math.max(0, nowTs - Number(m.lastResumedAt));
      }
      if (baseAccumulated > 0) {
        return baseAccumulated;
      }
      if (m.startedAt && m.completedAt && Number(m.completedAt) > Number(m.startedAt)) {
        return Number(m.completedAt) - Number(m.startedAt);
      }
      if (m.status === 'En Progreso' && m.startedAt) {
        return Math.max(0, nowTs - Number(m.startedAt));
      }
      return 0;
    };

      if (!plainText) return '';
      try {

        return plainText;

    const decryptPassword = (cipherText) => {
      if (!cipherText) return '';
      try {
        if (!cipherText.includes("_" + SECRET_CRYPTO_KEY)) return cipherText;
        const decoded = atob(cipherText).replace("_" + SECRET_CRYPTO_KEY, "");
        return decodeURIComponent(decoded);
      } catch (e) {
        return cipherText;

          fullMessageText = `⏸️ MENSAJE AUTOMATICO: Hola "${mission.clientName}". He puesto en pausa temporalmente tu mision "${mission.missionTitle}". Tienes la cuenta 100% libre para entrar a jugar con normalidad. Te llegará otro mensaje por aquí cuando vuelva a retomarla! 😋`;
        } else if (eventType === 'mission_resumed') {
          fullMessageText = `▶️ MENSAJE AUTOMATICO: Hola "${mission.clientName}". Vuelvo a entrar a tu cuenta para continuar con la misión "${mission.missionTitle}". Por favor, no entres al juego hasta que te llegue un mensaje de PAUSA, y si te he sacado de la cuenta, ya no vuelvas a entrar tampoco. 😏`;

            console.error("Error guardando en whatsapp_queue:", e);

        if (automationSettings.makeWebhookUrl && automationSettings.makeWebhookUrl.startsWith('http')) {
          try {
            fetch(automationSettings.makeWebhookUrl.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },

            }).catch(() => {});

      const handleSaveBotSettings = async (e) => {

          } catch (err) {
            console.error(err);
          }
        }
      };

      const handleTestMakeWebhook = async () => {
        if (!automationSettings.makeWebhookUrl || !automationSettings.makeWebhookUrl.startsWith('http')) {
          showToast('⚠️ Pega primero la URL del Webhook de Make.com');
          return;

        const testPayload = {

          isoDate: new Date().toISOString(),
          eventType: 'mission_paused',
          metaTemplateName: 'mision_pausada',
          toPhoneMeta: '34600000000',

          clientName: 'Cliente de Prueba',
          missionTitle: '3 Caminos Necrópolis',
          stepDetail: 'Camino 1',
          progressText: '1/3 (33%)',
          notes: 'Prueba de conexión',
          fullMessageText: '¡Hola Cliente de Prueba! ⏸️ Hemos puesto en pausa temporalmente tu misión "3 Caminos Necrópolis". Tienes tu cuenta 100% libre para entrar a jugar.',

        };
        try {

      const isCreatorSession = authUser?.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      const currentIsolatedWorker = workers.find(w => w.email?.toLowerCase() === authUser?.email?.toLowerCase()) || null;
      const isolatedWorkerId = currentIsolatedWorker ? currentIsolatedWorker.id : null;

      const currentRecipientKey = isCreatorSession ? 'creator' : (isolatedWorkerId || null);

      const myNotifications = useMemo(() => {
        if (!currentRecipientKey) return [];
        return notifications
          .filter(n => n.recipient === currentRecipientKey)
          .sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
      }, [notifications, currentRecipientKey]);

      const unreadNotifCount = useMemo(() => {
        return myNotifications.filter(n => !n.read).length;
      }, [myNotifications]);

      useEffect(() => {
        if (!currentRecipientKey) return;
        if (!initialNotifLoadDoneRef.current) {
          if (notifications.length >= 0) {
            myNotifications.forEach(n => knownNotifIdsRef.current.add(n.id));
            initialNotifLoadDoneRef.current = true;
          }
          return;
        }

        const newlyArrived = myNotifications.filter(n => !knownNotifIdsRef.current.has(n.id));
        if (newlyArrived.length > 0) {
          newlyArrived.forEach(n => knownNotifIdsRef.current.add(n.id));
          const latest = newlyArrived[0];

          if (Date.now() - (Number(latest.createdAt) || 0) < 30000) {
            if (soundEnabled) {

            setLiveBannerAlert(latest);
            setTimeout(() => {
              setLiveBannerAlert(prev => (prev?.id === latest.id ? null : prev));
            }, 6000);

            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {

                new Notification(latest.title || 'Misiones Gaming', {
                  body: latest.message || '',
                  silent: false
                });

            }
          }

      }, [myNotifications, currentRecipientKey, soundEnabled, notifications.length]);

      const pushCloudNotification = async ({ recipient, title, message, eventType = 'info', missionTitle = '', clientName = '' }) => {
        if (!db || !recipient) return;
        const now = Date.now();
        const notifId = `notif-${now}-${Math.random().toString(36).slice(2, 7)}`;
        const newNotif = {
          id: notifId,
          recipient,
          title,
          message,
          eventType,
          missionTitle,
          clientName,
          read: false,

        };

          await setDoc(doc(db, "notifications", notifId), newNotif);

          console.error("Error enviando notificación:", err);

      const handleMarkNotifAsRead = async (notif) => {
        if (!db || notif.read) return;
        try {
          await setDoc(doc(db, "notifications", notif.id), { read: true }, { merge: true });
        } catch (e) { console.error(e); }
      };

      const handleMarkAllNotifsAsRead = async () => {
        if (!db) return;
        const unread = myNotifications.filter(n => !n.read);
        for (const n of unread) {
          try {
            await setDoc(doc(db, "notifications", n.id), { read: true }, { merge: true });
          } catch (e) {}
        }
        showToast('✓ Todas las notificaciones marcadas como leídas');
      };

      const handleClearAllMyNotifications = async () => {
        if (!db) return;
        for (const n of myNotifications) {
          try {
            await deleteDoc(doc(db, "notifications", n.id));
          } catch (e) {}
        }
        showToast('🗑️ Historial de notificaciones vaciado');
      };

      const requestBrowserNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          showToast('⚠️ Tu navegador no soporta notificaciones nativas');
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          setBrowserNotifPermission(perm);
          if (perm === 'granted') {
            showToast('📲 Avisos nativos del navegador activados');
          } else {
            showToast('⚠️ Permiso denegado en el navegador');
          }
        } catch (e) {}
      };

      const workerPerformanceStats = useMemo(() => {
        const stats = {};
        workers.forEach(w => {
          const wMissions = missions.filter(m => m.workerId === w.id && !isTestClient(m.clientName));
          const completedMissions = wMissions.filter(m => m.status === 'Completada');
          const currentMonthCompleted = monthFilter === 'ALL' ? completedMissions : completedMissions.filter(m => m.monthYear === monthFilter);
          const activeQueueCount = wMissions.filter(m => m.status === 'En Progreso' || m.status === 'En Pausa' || m.status === 'Pendiente').length;

          const missionsEarnedUSD = completedMissions.reduce((acc, m) => {
            const currentPay = Number(m.workerPayUSD) || 0;
            const originalPay = m.originalWorkerPayUSD !== undefined ? Number(m.originalWorkerPayUSD) : currentPay;
            return acc + originalPay;
          }, 0);

          const paidHistorySumUSD = (w.paidHistory || []).reduce((acc, h) => acc + (Number(h.amountPaidUSD) || 0), 0);
          const pendingCurrentUSD = completedMissions.reduce((acc, m) => acc + (Number(m.workerPayUSD) || 0), 0);
          const historicalEarnedUSD = Math.max(missionsEarnedUSD, paidHistorySumUSD + pendingCurrentUSD);

          let totalDurationMs = 0;
          let timedMissionsCount = 0;
          completedMissions.forEach(m => {
            const effectiveMs = getMissionEffectiveWorkMs(m);
            if (effectiveMs > 0) {
              totalDurationMs += effectiveMs;
              timedMissionsCount += 1;
            }
          });
          const avgDurationMs = timedMissionsCount > 0 ? Math.round(totalDurationMs / timedMissionsCount) : 0;

          stats[w.id] = {
            completedThisMonth: currentMonthCompleted.length,
            activeQueue: activeQueueCount,
            totalHistoricalUSD: historicalEarnedUSD,
            avgCompletionTime: formatDuration(avgDurationMs)
          };
        });
        return stats;
      }, [workers, missions, monthFilter]);

      // Total global pendiente de pagar a todos los mercenarios
      const totalPendingAllWorkersUSD = useMemo(() => {
        return missions
          .filter(m => !isTestClient(m.clientName) && m.status === 'Completada' && m.workerId !== 'unassigned' && Number(m.workerPayUSD) > 0)
          .reduce((acc, m) => acc + (Number(m.workerPayUSD) || 0), 0);
      }, [missions]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await signInWithEmailAndPassword(auth, emailInput.trim(), passwordInput);
          setEmailInput('');
          setPasswordInput('');
          showToast('🔒 Conexión segura establecida');
        } catch (err) {
          console.error(err);
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
          setIsNotifPanelOpen(false);
          showToast('Sesión cerrada');
        } catch (err) { console.error(err); }
      };

      const getMissionTagIds = (mission) => Array.isArray(mission.tags) ? mission.tags : (mission.tagId ? [mission.tagId] : []);
      const getMissionChecklist = (mission) => Array.isArray(mission.checklist) ? mission.checklist : [];
      const getMissionTimestamp = (m) => {
        if (m.createdAt) return Number(m.createdAt);
        if (m.id && m.id.startsWith('mission-')) {
          const parsed = parseInt(m.id.replace('mission-', ''), 10);
          if (!isNaN(parsed)) return parsed;
        }
        return 0;
      };

      const getMissionClosedTimestamp = (m) => {
        if (m.completedAt && Number(m.completedAt) > 0) return Number(m.completedAt);
        return getMissionTimestamp(m);
      };

      const activeWorkerQueue = useMemo(() => {
        if (!isolatedWorkerId) return [];
        return missions
          .filter(m => m.workerId === isolatedWorkerId && (m.status === 'En Progreso' || m.status === 'En Pausa' || m.status === 'Pendiente'))
          .sort((a, b) => {
            const rankStatus = (st) => st === 'En Progreso' ? 0 : st === 'En Pausa' ? 1 : 2;
            if (rankStatus(a.status) !== rankStatus(b.status)) return rankStatus(a.status) - rankStatus(b.status);
            const prioA = a.workerPriorityOrder !== undefined ? Number(a.workerPriorityOrder) : 0;
            const prioB = b.workerPriorityOrder !== undefined ? Number(b.workerPriorityOrder) : 0;
            if (prioA !== prioB) return prioA - prioB;
            return getMissionTimestamp(b) - getMissionTimestamp(a);
          });
      }, [missions, isolatedWorkerId]);

      const completedWorkerMissions = useMemo(() => {
        if (!isolatedWorkerId) return [];
        return missions
          .filter(m => m.workerId === isolatedWorkerId && m.status === 'Completada')
          .sort((a, b) => getMissionClosedTimestamp(b) - getMissionClosedTimestamp(a));
      }, [missions, isolatedWorkerId]);

      const availableMonths = useMemo(() => {
        const monthSet = new Set([systemCurrentMonth]);
        missions.forEach(m => { if (m.monthYear) monthSet.add(m.monthYear); });
        return Array.from(monthSet).sort((a, b) => parseMonthYearSortValue(b) - parseMonthYearSortValue(a));
      }, [missions, systemCurrentMonth]);

      const creatorMissionCounts = useMemo(() => {
        const base = missions.filter(m => {
          if (monthFilter !== 'ALL' && m.monthYear !== monthFilter) return false;
          if (tagFilter !== 'ALL' && !getMissionTagIds(m).includes(tagFilter)) return false;
          if (workerFilter !== 'ALL' && m.workerId !== workerFilter) return false;
          if (paymentFilter !== 'ALL' && getMissionPaymentMethod(m) !== paymentFilter) return false;
          if (searchQuery.trim() && !m.clientName.toLowerCase().includes(searchQuery.toLowerCase()) && !m.missionTitle.toLowerCase().includes(searchQuery.toLowerCase()) && !(m.accountUser || '').toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });

        const inProgress = base.filter(m => m.status === 'En Progreso').length;
        const paused = base.filter(m => m.status === 'En Pausa').length;
        const pending = base.filter(m => m.status === 'Pendiente').length;
        const completed = base.filter(m => m.status === 'Completada').length;

        return { active: inProgress + paused + pending, inProgress, paused, pending, completed, all: base.length };
      }, [missions, monthFilter, tagFilter, workerFilter, paymentFilter, searchQuery]);

      const creatorFilteredMissions = useMemo(() => {
        return missions
          .filter(m => {
            if (monthFilter !== 'ALL' && m.monthYear !== monthFilter) return false;
            if (statusFilter === 'ACTIVE') {
              if (m.status !== 'Pendiente' && m.status !== 'En Progreso' && m.status !== 'En Pausa') return false;
            } else if (statusFilter !== 'ALL' && m.status !== statusFilter) return false;
            if (tagFilter !== 'ALL' && !getMissionTagIds(m).includes(tagFilter)) return false;
            if (workerFilter !== 'ALL' && m.workerId !== workerFilter) return false;
            if (paymentFilter !== 'ALL' && getMissionPaymentMethod(m) !== paymentFilter) return false;
            if (searchQuery.trim() && !m.clientName.toLowerCase().includes(searchQuery.toLowerCase()) && !m.missionTitle.toLowerCase().includes(searchQuery.toLowerCase()) && !(m.accountUser || '').toLowerCase().includes(searchQuery.toLowerCase())) return false;
            return true;
          })
          .sort((a, b) => {
            if (statusFilter === 'Completada' || (a.status === 'Completada' && b.status === 'Completada')) {
              const closeDiff = getMissionClosedTimestamp(b) - getMissionClosedTimestamp(a);
              if (closeDiff !== 0) return closeDiff;
            }
            return getMissionTimestamp(b) - getMissionTimestamp(a);
          });
      }, [missions, monthFilter, statusFilter, tagFilter, workerFilter, paymentFilter, searchQuery]);

      const creatorFinancialsByMonth = useMemo(() => {
        const summary = {};
        availableMonths.forEach(month => {
          const monthMissions = missions.filter(m => m.monthYear === month && !isTestClient(m.clientName));

          const calcModalityStats = (list) => {
            const revenueEUR = list.reduce((acc, m) => acc + (Number(m.priceTotalEUR) || 0), 0);
            const workerCostUSD = list
              .filter(m => m.status === 'Completada' && m.workerId !== 'unassigned')
              .reduce((acc, m) => acc + (Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0), 0);
            const workerCostEUR = workerCostUSD * 0.92;
            const netProfitEUR = revenueEUR - workerCostEUR;
            return {
              revenueEUR,
              workerCostUSD,
              workerCostEUR,
              netProfitEUR,
              count: list.length
            };
          };

          const totalStats = calcModalityStats(monthMissions);
          const bizumMissions = monthMissions.filter(m => getMissionPaymentMethod(m) === 'Bizum');
          const paypalMissions = monthMissions.filter(m => getMissionPaymentMethod(m) === 'PayPal');

          summary[month] = {
            totalEUR: totalStats.revenueEUR,
            totalUSDWorkerCost: totalStats.workerCostUSD,
            totalEURWorkerCost: totalStats.workerCostEUR,
            netProfitEUR: totalStats.netProfitEUR,
            missionCount: monthMissions.length,
            bizum: calcModalityStats(bizumMissions),
            paypal: calcModalityStats(paypalMissions)
          };
        });
        return summary;
      }, [missions, availableMonths]);

      // Analítica Global Interactiva para la Pestaña de Finanzas Mensuales
      const financeDashboardStats = useMemo(() => {
        const monthsChronological = [...availableMonths].reverse(); // De más antiguo a más reciente para los gráficos
        const targetMonths = financeSelectedMonth === 'ALL' ? availableMonths : [financeSelectedMonth];

        let totalRevenueEUR = 0;
        let totalWorkerCostUSD = 0;
        let totalWorkerCostEUR = 0;
        let totalNetProfitEUR = 0;
        let totalMissions = 0;

        let bizumRevenueEUR = 0;
        let bizumCostUSD = 0;
        let bizumProfitEUR = 0;
        let bizumCount = 0;

        let paypalRevenueEUR = 0;
        let paypalCostUSD = 0;
        let paypalProfitEUR = 0;
        let paypalCount = 0;

        targetMonths.forEach(m => {
          const d = creatorFinancialsByMonth[m];
          if (!d) return;
          totalRevenueEUR += d.totalEUR;
          totalWorkerCostUSD += d.totalUSDWorkerCost;
          totalWorkerCostEUR += d.totalEURWorkerCost;
          totalNetProfitEUR += d.netProfitEUR;
          totalMissions += d.missionCount;

          bizumRevenueEUR += d.bizum.revenueEUR;
          bizumCostUSD += d.bizum.workerCostUSD;
          bizumProfitEUR += d.bizum.netProfitEUR;
          bizumCount += d.bizum.count;

          paypalRevenueEUR += d.paypal.revenueEUR;
          paypalCostUSD += d.paypal.workerCostUSD;
          paypalProfitEUR += d.paypal.netProfitEUR;
          paypalCount += d.paypal.count;
        });

        const profitMarginPct = totalRevenueEUR > 0 ? Math.round((totalNetProfitEUR / totalRevenueEUR) * 100) : 0;
        const avgRevenuePerMission = totalMissions > 0 ? (totalRevenueEUR / totalMissions) : 0;
        const avgProfitPerMission = totalMissions > 0 ? (totalNetProfitEUR / totalMissions) : 0;

        const bizumSharePct = totalRevenueEUR > 0 ? Math.round((bizumRevenueEUR / totalRevenueEUR) * 100) : 0;
        const paypalSharePct = totalRevenueEUR > 0 ? (100 - bizumSharePct) : 0;

        // Datos para el gráfico de barras de evolución mensual
        const chartSeries = monthsChronological.map(m => {
          const d = creatorFinancialsByMonth[m] || { totalEUR: 0, totalUSDWorkerCost: 0, totalEURWorkerCost: 0, netProfitEUR: 0, missionCount: 0 };
          const margin = d.totalEUR > 0 ? Math.round((d.netProfitEUR / d.totalEUR) * 100) : 0;
          return {
            month: m,
            shortLabel: m.split(' ')[0].slice(0, 3) + ' ' + (m.split(' ')[1]?.slice(2) || ''),
            revenueEUR: d.totalEUR,
            workerCostUSD: d.totalUSDWorkerCost,
            workerCostEUR: d.totalEURWorkerCost,
            netProfitEUR: d.netProfitEUR,
            missionCount: d.missionCount,
            margin
          };
        });

        const maxChartVal = Math.max(...chartSeries.map(s => Math.max(s.revenueEUR, s.netProfitEUR, 1)), 100);

        // Desglose de coste generado por cada mercenario en el periodo seleccionado
        const filteredMissionsInPeriod = missions.filter(m =>
          !isTestClient(m.clientName) &&
          m.status === 'Completada' &&
          m.workerId !== 'unassigned' &&
          (financeSelectedMonth === 'ALL' || m.monthYear === financeSelectedMonth)
        );

        const workerBreakdown = workers.map(w => {
          const wMissions = filteredMissionsInPeriod.filter(m => m.workerId === w.id);
          const generatedEUR = wMissions.reduce((acc, m) => acc + (Number(m.priceTotalEUR) || 0), 0);
          const costUSD = wMissions.reduce((acc, m) => acc + (Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0), 0);
          const netEUR = generatedEUR - (costUSD * 0.92);
          return {
            ...w,
            missionsCount: wMissions.length,
            generatedEUR,
            costUSD,
            netEUR
          };
        }).sort((a, b) => b.generatedEUR - a.generatedEUR);

        return {
          totalRevenueEUR,
          totalWorkerCostUSD,
          totalWorkerCostEUR,
          totalNetProfitEUR,
          totalMissions,
          profitMarginPct,
          avgRevenuePerMission,
          avgProfitPerMission,
          bizum: { revenueEUR: bizumRevenueEUR, costUSD: bizumCostUSD, profitEUR: bizumProfitEUR, count: bizumCount, sharePct: bizumSharePct },
          paypal: { revenueEUR: paypalRevenueEUR, costUSD: paypalCostUSD, profitEUR: paypalProfitEUR, count: paypalCount, sharePct: paypalSharePct },
          chartSeries,
          maxChartVal,
          workerBreakdown
        };
      }, [availableMonths, financeSelectedMonth, creatorFinancialsByMonth, missions, workers]);

      const tagAnalytics = useMemo(() => {
        const nonTestMissions = missions.filter(m => !isTestClient(m.clientName));
        const filteredMissions = tagStatsPeriod === 'ALL' ? nonTestMissions : nonTestMissions.filter(m => m.monthYear === tagStatsPeriod);
        const totalMissionsInPeriod = filteredMissions.length;

        const statsList = tags.map(t => {
          const matchingMissions = filteredMissions.filter(m => getMissionTagIds(m).includes(t.id));
          const count = matchingMissions.length;
          const revenueEUR = matchingMissions.reduce((acc, m) => acc + (Number(m.priceTotalEUR) || 0), 0);
          const workerCostUSD = matchingMissions.reduce((acc, m) => acc + (Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0), 0);
          
          const workerCostEUR = workerCostUSD * 0.92;
          const netProfitEUR = revenueEUR - workerCostEUR;
          const percentage = totalMissionsInPeriod > 0 ? Math.round((count / totalMissionsInPeriod) * 100) : 0;

          return { ...t, count, revenueEUR, workerCostUSD, workerCostEUR, netProfitEUR, percentage };
        }).sort((a, b) => b.count !== a.count ? b.count - a.count : b.revenueEUR - a.revenueEUR);

        const maxCount = statsList.length > 0 ? Math.max(...statsList.map(s => s.count), 1) : 1;
        return { statsList, totalMissionsInPeriod, maxCount };
      }, [tags, missions, tagStatsPeriod]);

      const knownClientsDatabase = useMemo(() => {
        const sorted = [...missions].sort((a, b) => getMissionTimestamp(b) - getMissionTimestamp(a));
        const clientMap = new Map();

        sorted.forEach(m => {
          const rawName = (m.clientName || '').trim();
          if (!rawName || isExcludedInternalClient(rawName)) return;
          const key = rawName.toLowerCase();
          const phoneVal = m.clientPhone || m.clientContact || '';

          if (!clientMap.has(key)) {
            clientMap.set(key, {
              clientName: rawName,
              clientPhone: phoneVal,
              clientContact: phoneVal,
              accountUser: m.accountUser || '',
              accountPass: decryptPassword(m.accountPass) || '',
              loginMethod: m.loginMethod || 'Kabam ID',
              paymentMethod: getMissionPaymentMethod(m),
              workerId: m.workerId || 'unassigned',
              missionsCount: 1,
              totalSpentEUR: Number(m.priceTotalEUR) || 0
            });
          } else {
            const existing = clientMap.get(key);
            existing.missionsCount += 1;
            existing.totalSpentEUR += (Number(m.priceTotalEUR) || 0);
            if (!existing.clientPhone && phoneVal) existing.clientPhone = phoneVal;
            if (!existing.clientContact && phoneVal) existing.clientContact = phoneVal;
            if (!existing.accountUser && m.accountUser) existing.accountUser = m.accountUser;
            if (!existing.accountPass && m.accountPass) existing.accountPass = decryptPassword(m.accountPass);
            if (!existing.loginMethod && m.loginMethod) existing.loginMethod = m.loginMethod;
          }
        });

        return Array.from(clientMap.values()).sort((a, b) => {
          if (b.missionsCount !== a.missionsCount) return b.missionsCount - a.missionsCount;
          return b.totalSpentEUR - a.totalSpentEUR;
        });
      }, [missions]);

      const matchingClientSuggestions = useMemo(() => {
        const q = (missionForm.clientName || '').trim().toLowerCase();
        if (!q) return knownClientsDatabase.slice(0, 6);

      const countryAnalytics = useMemo(() => {
        const nonTestMissions = missions.filter(m => !isExcludedInternalClient(m.clientName));
        const filteredMissions = tagStatsPeriod === 'ALL' ? nonTestMissions : nonTestMissions.filter(m => m.monthYear === tagStatsPeriod);
        const totalMissionsInPeriod = filteredMissions.length;
        const map = new Map();

        filteredMissions.forEach(m => {
          const rawName = (m.clientName || '').trim();
          if (!rawName || isExcludedInternalClient(rawName)) return;
          const phoneVal = m.clientPhone || m.clientContact || '';
          const cInfo = getCountryInfoFromPhone(phoneVal);
          const key = cInfo.name;

          const rev = Number(m.priceTotalEUR) || 0;
          const costUSD = Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0;

          if (!map.has(key)) {
            map.set(key, {
              countryName: cInfo.name,
              flag: cInfo.flag,
              count: 0,
              revenueEUR: 0,
              workerCostUSD: 0
            });
          }

          const item = map.get(key);
          item.count += 1;
          item.revenueEUR += rev;
          item.workerCostUSD += costUSD;
        });

        const statsList = Array.from(map.values()).map(item => {
          const workerCostEUR = item.workerCostUSD * 0.92;
          const netProfitEUR = item.revenueEUR - workerCostEUR;
          const percentage = totalMissionsInPeriod > 0 ? Math.round((item.count / totalMissionsInPeriod) * 100) : 0;
          return {
            ...item,
            workerCostEUR,
            netProfitEUR,
            percentage
          };
        });

        statsList.sort((a, b) => {
          if (b.count !== a.count) return b.count - a.count;
          return b.revenueEUR - a.revenueEUR;
        });

        const maxCount = statsList.length > 0 ? Math.max(...statsList.map(s => s.count), 1) : 1;

      }, [missions, tagStatsPeriod]);

      const clientAnalytics = useMemo(() => {
        const nonTestMissions = missions.filter(m => !isExcludedInternalClient(m.clientName));
        const filteredMissions = tagStatsPeriod === 'ALL' ? nonTestMissions : nonTestMissions.filter(m => m.monthYear === tagStatsPeriod);
        const totalMissionsInPeriod = filteredMissions.length;
        const map = new Map();

        const globalLastActivityMap = new Map();
        missions.forEach(m => {
          const rawName = (m.clientName || '').trim();
          if (!rawName || isExcludedInternalClient(rawName)) return;
          const key = rawName.toLowerCase();
          const mTs = Math.max(getMissionTimestamp(m), Number(m.completedAt) || 0);
          const prev = globalLastActivityMap.get(key);
          if (!prev || mTs > prev.lastMissionTs) {
            globalLastActivityMap.set(key, {
              lastMissionTs: mTs,
              lastMissionTitle: m.missionTitle || 'Misión'
            });
          }
        });

        filteredMissions.forEach(m => {
          const rawName = (m.clientName || '').trim();
          if (!rawName || isExcludedInternalClient(rawName)) return;
          const key = rawName.toLowerCase();

          const rev = Number(m.priceTotalEUR) || 0;
          const costUSD = Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0;
          const phoneVal = m.clientPhone || m.clientContact || '';
          const mTs = Math.max(getMissionTimestamp(m), Number(m.completedAt) || 0);
          const globalLast = globalLastActivityMap.get(key) || { lastMissionTs: mTs, lastMissionTitle: m.missionTitle || 'Misión' };

          if (!map.has(key)) {
            map.set(key, {
              key,
              clientName: rawName,
              clientPhone: phoneVal,
              clientContact: phoneVal,
              accountUser: m.accountUser || '',
              accountPass: decryptPassword(m.accountPass) || '',
              loginMethod: m.loginMethod || 'Kabam ID',
              paymentMethod: getMissionPaymentMethod(m),
              count: 0,
              revenueEUR: 0,
              workerCostUSD: 0,
              lastMissionTs: globalLast.lastMissionTs,
              lastMissionTitle: globalLast.lastMissionTitle
            });
          }

          const item = map.get(key);
          item.count += 1;
          item.revenueEUR += rev;
          item.workerCostUSD += costUSD;
          if (!item.accountUser && m.accountUser) item.accountUser = m.accountUser;
          if (!item.accountPass && m.accountPass) item.accountPass = decryptPassword(m.accountPass);
          if (!item.clientPhone && phoneVal) item.clientPhone = phoneVal;
          if (!item.clientContact && phoneVal) item.clientContact = phoneVal;
        });

        const nowMs = Date.now();
        const allClientsList = Array.from(map.values()).map(item => {
          const workerCostEUR = item.workerCostUSD * 0.92;
          const netProfitEUR = item.revenueEUR - workerCostEUR;
          const percentage = totalMissionsInPeriod > 0 ? Math.round((item.count / totalMissionsInPeriod) * 100) : 0;
          const daysInactive = item.lastMissionTs > 0 ? Math.max(0, Math.floor((nowMs - item.lastMissionTs) / 86400000)) : null;
          return {
            ...item,
            workerCostEUR,
            netProfitEUR,
            percentage,
            daysInactive
          };
        });

        const inactive15Count = allClientsList.filter(c => c.daysInactive !== null && c.daysInactive >= 15).length;
        const inactive30Count = allClientsList.filter(c => c.daysInactive !== null && c.daysInactive >= 30).length;

        let statsList = [...allClientsList];

        if (clientFilterMode === 'INACTIVE_15') {
          statsList = statsList.filter(c => c.daysInactive !== null && c.daysInactive >= 15);
        } else if (clientFilterMode === 'INACTIVE_30') {
          statsList = statsList.filter(c => c.daysInactive !== null && c.daysInactive >= 30);
        }

        if (clientSearchQuery.trim()) {
          const q = clientSearchQuery.trim().toLowerCase();
          statsList = statsList.filter(c =>
            c.clientName.toLowerCase().includes(q) ||
            (c.accountUser && c.accountUser.toLowerCase().includes(q)) ||
            (c.clientPhone && c.clientPhone.toLowerCase().includes(q)) ||
            (c.lastMissionTitle && c.lastMissionTitle.toLowerCase().includes(q))
          );
        }

        if (clientFilterMode === 'OLDEST' || clientFilterMode === 'INACTIVE_15' || clientFilterMode === 'INACTIVE_30') {
          statsList.sort((a, b) => {
            const dA = a.daysInactive !== null ? a.daysInactive : -1;
            const dB = b.daysInactive !== null ? b.daysInactive : -1;
            if (dB !== dA) return dB - dA;
            return b.revenueEUR - a.revenueEUR;
          });
        } else {
          statsList.sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return b.revenueEUR - a.revenueEUR;
          });
        }

        const maxCount = allClientsList.length > 0 ? Math.max(...allClientsList.map(s => s.count), 1) : 1;

        return {
          statsList,
          maxCount,
          totalClients: allClientsList.length,
          inactive15Count,
          inactive30Count
        };
      }, [missions, tagStatsPeriod, clientFilterMode, clientSearchQuery]);

      const handleReactivateClientWhatsApp = (client) => {

            ...payload,
            id: newId,
            status: 'Pendiente',
            orderIndex: missions.length + 1,
            createdAt: nowTs,
            startedAt: null,
            lastResumedAt: null,
            accumulatedWorkMs: 0,
            completedAt: null,
            completionNotes: ''
          };
          if (db) {
            await setDoc(doc(db, "missions", newId), newM);

            if (payload.workerId && payload.workerId !== 'unassigned') {
              await pushCloudNotification({
                recipient: payload.workerId,
                title: '🎯 Nueva Misión Asignada',
                message: `El Creador te ha asignado "${payload.missionTitle}" (Cliente: ${payload.clientName} • Pago: $${payload.workerPayUSD} USD).`,
                eventType: 'assigned',
                missionTitle: payload.missionTitle,
                clientName: payload.clientName
              });
            }
          }
          if (monthFilter !== 'ALL') setMonthFilter(targetMonthYear);
          if (statusFilter === 'Completada') setStatusFilter('ACTIVE');
          showToast(`✅ Misión registrada (${payload.paymentMethod})`);
        }
        setIsMissionModalOpen(false);
      };

      const handleQuickWorkerReassign = async (mission, newWorkerId) => {
        if (!db) return;
        const oldWorkerId = mission.workerId || 'unassigned';
        if (oldWorkerId === newWorkerId) return;

        try {
          await setDoc(doc(db, "missions", mission.id), { workerId: newWorkerId }, { merge: true });

          const oldWorkerObj = workers.find(w => w.id === oldWorkerId);
          const newWorkerObj = workers.find(w => w.id === newWorkerId);

          if (oldWorkerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: oldWorkerId,
              title: '⚠️ Misión Retirada de tu Cola',
              message: `El Creador ha retirado o reasignado la misión "${mission.missionTitle}" (Cliente: ${mission.clientName}).`,
              eventType: 'removed',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          if (newWorkerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: newWorkerId,
              title: '🎯 Nueva Misión Asignada',
              message: `El Creador te ha asignado "${mission.missionTitle}" (Cliente: ${mission.clientName} • Pago: $${mission.workerPayUSD} USD).`,
              eventType: 'assigned',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          if (newWorkerObj) {
            showToast(`🥷 Misión asignada a ${newWorkerObj.name} (Notificado)`);
          } else if (oldWorkerObj) {
            showToast(`⚠️ Misión retirada a ${oldWorkerObj.name} (Notificado)`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleCreatorQuickStatusChange = async (mission, newStatus) => {
        if (!db || mission.status === newStatus) return;
        const now = Date.now();
        let accumulated = Number(mission.accumulatedWorkMs) || 0;
        if (mission.status === 'En Progreso') {
          const startRef = Number(mission.lastResumedAt || mission.startedAt || now);
          accumulated += Math.max(0, now - startRef);
        }

        const updatePayload = {
          status: newStatus,
          accumulatedWorkMs: accumulated,
          lastResumedAt: newStatus === 'En Progreso' ? now : null,
          startedAt: mission.startedAt || (newStatus === 'En Progreso' ? now : null),
          completedAt: newStatus === 'Completada' ? now : (mission.completedAt || null)
        };

        try {
          await setDoc(doc(db, "missions", mission.id), updatePayload, { merge: true });

          if (mission.workerId && mission.workerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: mission.workerId,
              title: `🔄 Estado cambiado a ${newStatus}`,
              message: `El Creador cambió el estado de "${mission.missionTitle}" (${mission.clientName}) a ${newStatus}.`,
              eventType: newStatus === 'Completada' ? 'completed' : 'status_changed',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          if (newStatus === 'En Pausa') {
            await triggerAutomaticClientWhatsApp({ mission, eventType: 'mission_paused', metaTemplateName: 'mision_pausada' });
          } else if (newStatus === 'En Progreso') {
            const wasPaused = mission.status === 'En Pausa';
            await triggerAutomaticClientWhatsApp({
              mission,
              eventType: wasPaused ? 'mission_resumed' : 'mission_started',
              metaTemplateName: wasPaused ? 'mision_reanudada' : 'mision_iniciada'
            });
          } else if (newStatus === 'Completada') {
            await triggerAutomaticClientWhatsApp({ mission, eventType: 'mission_completed', metaTemplateName: 'mision_completada' });
          }

          showToast(`Estado cambiado a ${newStatus}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleQuickTogglePaymentMethod = async (mission) => {
        if (!db) return;
        const currentMethod = getMissionPaymentMethod(mission);
        const nextMethod = currentMethod === 'Bizum' ? 'PayPal' : 'Bizum';
        try {
          await setDoc(doc(db, "missions", mission.id), { paymentMethod: nextMethod }, { merge: true });
          showToast(`💳 Método cambiado a ${nextMethod}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleStartMission = async (mission) => {
        const now = Date.now();
        const isResuming = mission.status === 'En Pausa';
        if (db) {
          await setDoc(doc(db, "missions", mission.id), {
            status: 'En Progreso',
            startedAt: mission.startedAt || now,
            lastResumedAt: now
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: isResuming ? `▶️ ${workerName} reanudó la misión` : `⚡ ${workerName} empezó una misión`,
            message: isResuming
              ? `${workerName} ha vuelto a entrar a la cuenta de ${mission.clientName} para continuar "${mission.missionTitle}".`
              : `${workerName} ha puesto EN CURSO "${mission.missionTitle}" del cliente ${mission.clientName}.`,
            eventType: 'started',
            missionTitle: mission.missionTitle,
            clientName: mission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission,
            eventType: isResuming ? 'mission_resumed' : 'mission_started',
            metaTemplateName: isResuming ? 'mision_reanudada' : 'mision_iniciada'
          });
        }
        showToast(isResuming ? '▶️ Misión reanudada' : '▶️ Misión puesta En Curso');
      };

      const handlePauseMission = async (mission) => {
        const now = Date.now();
        const startRef = Number(mission.lastResumedAt || mission.startedAt || now);
        const sessionElapsed = Math.max(0, now - startRef);
        const newAccumulated = (Number(mission.accumulatedWorkMs) || 0) + sessionElapsed;

        if (db) {
          await setDoc(doc(db, "missions", mission.id), {
            status: 'En Pausa',
            accumulatedWorkMs: newAccumulated,
            lastResumedAt: null,
            lastPausedAt: now
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: `⏸️ Misión Pausada (${mission.clientName} puede entrar)`,
            message: `${workerName} ha pausado "${mission.missionTitle}". Cuenta libre para el cliente ${mission.clientName}. (Tiempo trabajado: ${formatDuration(newAccumulated)}).`,
            eventType: 'status_changed',
            missionTitle: mission.missionTitle,
            clientName: mission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission,
            eventType: 'mission_paused',
            metaTemplateName: 'mision_pausada'
          });
        }
        showToast('⏸️ Misión en pausa (Cliente avisado automáticamente)');
      };

      const handlePrioritizeMission = async (mission) => {
        if (!activeWorkerQueue || activeWorkerQueue.length === 0) return;
        const minPrio = Math.min(...activeWorkerQueue.map(m => m.workerPriorityOrder !== undefined ? Number(m.workerPriorityOrder) : 0));
        if (db) { await setDoc(doc(db, "missions", mission.id), { workerPriorityOrder: minPrio - 1 }, { merge: true }); }
        showToast('⬆️ Misión priorizada');
      };

      const handleConfirmCompleteMission = async (e) => {
        e.preventDefault();
        if (!completingMission) return;
        const now = Date.now();
        const finalNote = completionNoteInput.trim() || 'Completado con éxito.';

        let totalEffectiveMs = Number(completingMission.accumulatedWorkMs) || 0;
        if (completingMission.status === 'En Progreso') {
          const startRef = Number(completingMission.lastResumedAt || completingMission.startedAt || now);
          totalEffectiveMs += Math.max(0, now - startRef);
        } else if (totalEffectiveMs === 0 && completingMission.startedAt) {
          totalEffectiveMs = Math.max(0, now - Number(completingMission.startedAt));
        }

        const updatedChecklist = getMissionChecklist(completingMission).map(item => ({ ...item, done: true }));

        if (db) {
          await setDoc(doc(db, "missions", completingMission.id), {
            status: 'Completada',
            completedAt: now,
            lastResumedAt: null,
            accumulatedWorkMs: totalEffectiveMs,
            checklist: updatedChecklist,
            completionNotes: finalNote,
            accountPass: "🔒 [CONTRASEÑA DESTRUIDA POR SEGURIDAD]"
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: `✅ ¡${workerName} completó una misión!`,
            message: `${workerName} ha finalizado "${completingMission.missionTitle}" (Cliente: ${completingMission.clientName} • Contraseña destruida por seguridad).`,
            eventType: 'completed',
            missionTitle: completingMission.missionTitle,
            clientName: completingMission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission: completingMission,
            eventType: 'mission_completed',
            metaTemplateName: 'mision_completada',
            notes: finalNote
          });
        }
        showToast('✅ ¡Misión finalizada! Contraseña destruida de la BD por seguridad');
        setCompletingMission(null);
        setCompletionNoteInput('');
      };

      const handleDeleteMission = async () => {
        if (!missionToDelete) return;
        if (db) {
          const prevWorkerId = missionToDelete.workerId;
          const wasActive = missionToDelete.status !== 'Completada';
          await deleteDoc(doc(db, "missions", missionToDelete.id));

          if (prevWorkerId && prevWorkerId !== 'unassigned' && wasActive) {
            await pushCloudNotification({
              recipient: prevWorkerId,
              title: '🗑️ Misión Eliminada de tu Cola',
              message: `El Creador ha eliminado la misión "${missionToDelete.missionTitle}" (Cliente: ${missionToDelete.clientName}).`,
              eventType: 'removed',
              missionTitle: missionToDelete.missionTitle,
              clientName: missionToDelete.clientName
            });
          }
        }
        showToast('🗑️ Misión eliminada');
        setMissionToDelete(null);
      };

      const handleSaveWorker = async (e) => {
        e.preventDefault();
        if (!workerForm.name.trim() || !workerForm.email.trim()) { showToast('⚠️ Introduce nombre y Correo Firebase'); return; }
        
        const cleanEmail = workerForm.email.trim().toLowerCase();

        if (editingWorker) {
          if (db) { await setDoc(doc(db, "workers", editingWorker.id), { ...editingWorker, name: workerForm.name.trim(), email: cleanEmail, specialty: workerForm.specialty.trim(), color: workerForm.color }, { merge: true }); }
          showToast(`🥷 Mercenario ${workerForm.name} actualizado`);
        } else {
          const newId = `worker-${Date.now()}`;
          const newW = { id: newId, name: workerForm.name.trim(), email: cleanEmail, specialty: workerForm.specialty.trim() || 'Mercenario', color: workerForm.color || WORKER_COLOR_OPTIONS[0].id, paidHistory: [] };
          if (db) { await setDoc(doc(db, "workers", newId), newW); }
          showToast(`🥷 Mercenario ${newW.name} creado`);
        }
        setIsWorkerModalOpen(false);
      };

      const handleQuickWorkerColorChange = async (worker, newColorId) => {
        if (!db) return;
        try {
          await setDoc(doc(db, "workers", worker.id), { ...worker, color: newColorId }, { merge: true });
          const colorMeta = getWorkerColorMeta(newColorId);
          showToast(`🎨 Color de ${worker.name}: ${colorMeta.label}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleDeleteWorker = async () => {
        if (!workerToDelete) return;
        if (db) {
          await deleteDoc(doc(db, "workers", workerToDelete.id));
          const workerMissions = missions.filter(m => m.workerId === workerToDelete.id);
          for (const wm of workerMissions) { await setDoc(doc(db, "missions", wm.id), { workerId: 'unassigned' }, { merge: true }); }
        }
        showToast('🗑️ Mercenario eliminado');
        setWorkerToDelete(null);
      };

      const copyToClipboard = (text, label) => {
        if (!text) return;
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        showToast(`📋 ${label} copiado`);
      };

      const toggleCredentials = (id) => setVisibleCredentials(prev => ({ ...prev, [id]: !prev[id] }));

      const getPriorityBadge = (priority) => {
        if (priority === 'Urgente') return <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">URGENTE</span>;
        if (priority === 'VIP') return <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">VIP</span>;
        return <span className="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-300">Normal</span>;
      };

      const getStatusBadge = (status) => {
        if (status === 'En Progreso') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" /> ⚡ En Curso</span>;
        if (status === 'En Pausa') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 flex items-center gap-1">⏸️ En Pausa (Cliente Libre)</span>;
        if (status === 'Completada') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center gap-1">✓ Completada</span>;
        return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 flex items-center gap-1">⏳ Pendiente</span>;
      };

      const renderPaymentMethodBadge = (mission) => {
        const method = getMissionPaymentMethod(mission);
        const isPaypal = method === 'PayPal';
        return (
          <button
            type="button"
            onClick={() => handleQuickTogglePaymentMethod(mission)}
            title="Clic para cambiar rápido entre Bizum y PayPal"
            className={`px-2.5 py-0.5 rounded text-[10px] font-extrabold border flex items-center gap-1 transition ${
              isPaypal
                ? 'bg-blue-500/20 text-blue-300 border-blue-500/40 hover:bg-blue-500/30'
                : 'bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30'
            }`}
          >
            <span className={`w-1.5 h-1.5 rounded-full ${isPaypal ? 'bg-blue-400' : 'bg-rose-400'}`} />
            {isPaypal ? '💳 PayPal' : '📱 Bizum'}
          </button>
        );
      };

      const renderMissionTags = (mission) => {
        const missionTagIds = getMissionTagIds(mission);
        if (missionTagIds.length === 0) return null;
        return missionTagIds.map(tId => {
          const tagObj = tags.find(t => t.id === tId);
          if (!tagObj) return null;
          const colorMeta = getTagColorMeta(tagObj.color);
          return (
            <span key={tId} className={`px-2 py-0.5 rounded text-[10px] font-bold border flex items-center gap-1 ${colorMeta.badgeClass}`}>
              <Tag className="w-2.5 h-2.5" /> {tagObj.name}
            </span>
          );
        });
      };

      const renderMissionChecklistBlock = (mission) => {
        const list = getMissionChecklist(mission);
        if (list.length === 0) return null;
        const doneCount = list.filter(i => i.done).length;
        const pct = Math.round((doneCount / list.length) * 100);

        return (
          <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 space-y-2">
            <div className="flex items-center justify-between text-xs">
              <span className="font-extrabold text-amber-300 flex items-center gap-1.5">
                <ListChecks className="w-3.5 h-3.5" /> Progreso de Misión ({doneCount}/{list.length})
              </span>
              <span className="text-[11px] font-bold text-emerald-400">{pct}%</span>
            </div>
            <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-300" style={{ width: `${pct}%` }} />

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1">
              {list.map(item => (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => handleToggleMissionChecklistItem(mission, item.id)}
                  className={`px-2.5 py-1.5 rounded-lg border text-left text-xs font-bold flex items-center gap-2 transition ${
                    item.done
                      ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 line-through opacity-85'
                      : 'bg-slate-950 border-slate-800 text-slate-200 hover:border-indigo-500/50'
                  }`}
                >
                  <span className={`w-4 h-4 rounded flex items-center justify-center border shrink-0 ${
                    item.done ? 'bg-emerald-500 border-emerald-400 text-slate-950' : 'border-slate-600 bg-slate-900'

                    {item.done && <Check className="w-3 h-3 stroke-[3]" />}
                  </span>
                  <span className="truncate">{item.text}</span>

      const renderNotificationBell = () => {
        return (
          <div className="relative">

              onClick={() => setIsNotifPanelOpen(!isNotifPanelOpen)}
              className={`relative p-2.5 rounded-xl border transition flex items-center gap-1.5 ${
                unreadNotifCount > 0
                  ? 'bg-amber-500/15 border-amber-500/50 text-amber-300 hover:bg-amber-500/25'
                  : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
              }`}
              title="Centro de Notificaciones"
            >
              {unreadNotifCount > 0 ? (
                <BellRing className="w-4 h-4 text-amber-400 animate-bounce" />
              ) : (
                <Bell className="w-4 h-4" />
              )}
              {unreadNotifCount > 0 && (
                <span className="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-extrabold">
                  {unreadNotifCount}
                </span>
              )}
            </button>

            {isNotifPanelOpen && (
              <div className="fixed sm:absolute right-3 left-3 sm:left-auto sm:right-0 mt-2 sm:w-96 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl z-50 overflow-hidden">
                <div className="p-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <Bell className="w-4 h-4 text-amber-400" />
                    <span className="text-xs font-extrabold text-white">Notificaciones ({unreadNotifCount} sin leer)</span>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => setSoundEnabled(!soundEnabled)}
                      className={`p-1.5 rounded-lg border text-xs ${
                        soundEnabled ? 'bg-indigo-500/20 border-indigo-500/40 text-indigo-300' : 'bg-slate-900 border-slate-800 text-slate-500'
                      }`}
                      title={soundEnabled ? 'Sonido activado' : 'Sonido silenciado'}
                    >
                      {soundEnabled ? <Volume2 className="w-3.5 h-3.5" /> : <VolumeX className="w-3.5 h-3.5" />}
                    </button>

                        title="Marcar todas como leídas"
                      >
                        <CheckCheck className="w-3 h-3" /> Leer todas

                    <button

                    <button

                    >

                    </div>
                    <div>
                      <label className="block font-bold text-indigo-300 mb-1">Mercenario Asignado</label>
                      <select
                        value={missionForm.workerId}
                        onChange={(e) => setMissionForm({ ...missionForm, workerId: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-bold"
                      >
                        <option value="unassigned">⚠️ Sin asignar</option>
                        {workers.map(w => <option key={w.id} value={w.id}>🥷 {w.name}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Selector de Etiquetas dentro del modal */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2">
                    <span className="font-bold text-amber-300 block">Etiquetas de la Misión</span>
                    <div className="flex flex-wrap gap-1.5">
                      {tags.map(t => {
                        const selected = (missionForm.tags || []).includes(t.id);
                        const cMeta = getTagColorMeta(t.color);
                        return (
                          <button
                            key={t.id}
                            type="button"
                            onClick={() => toggleTagInMissionForm(t.id)}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border flex items-center gap-1 transition ${
                              selected ? `${cMeta.badgeClass} ring-2 ring-white/30` : 'bg-slate-900 border-slate-800 text-slate-400'
                            }`}
                          >
                            <Tag className="w-3 h-3" /> {t.name}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex items-center gap-2 pt-1">
                      <input
                        type="text"
                        value={quickTagName}
                        onChange={(e) => setQuickTagName(e.target.value)}
                        placeholder="Crear etiqueta rápida..."
                        className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                      />
                      <button type="button" onClick={handleQuickCreateTagInModal} className="px-3 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-lg font-bold">+ Etiqueta</button>
                    </div>
                  </div>

                  {/* Checklist de pasos / caminos */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2">
                    <span className="font-bold text-emerald-400 block">Checklist de Subtareas / Caminos (Notifica avance por WhatsApp)</span>
                    {(missionForm.checklist || []).length > 0 && (
                      <div className="space-y-1.5 max-h-36 overflow-y-auto">
                        {(missionForm.checklist || []).map((item) => (
                          <div key={item.id} className="flex items-center gap-2">
                            <input
                              type="text"
                              value={item.text}
                              onChange={(e) => handleUpdateChecklistItemTextInForm(item.id, e.target.value)}
                              className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white"
                            />
                            <button type="button" onClick={() => handleRemoveChecklistItemFromForm(item.id)} className="text-rose-400 font-bold px-2">✕</button>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={newChecklistItemText}
                        onChange={(e) => setNewChecklistItemText(e.target.value)}
                        placeholder="Ej. Camino 1 completado..."
                        className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                      />
                      <button type="button" onClick={handleAddChecklistItemToForm} className="px-3 py-1.5 bg-indigo-600/30 text-indigo-300 rounded-lg font-bold">+ Añadir Paso</button>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Instrucciones para el Mercenario</label>
                    <textarea
                      rows={2}
                      value={missionForm.instructions}
                      onChange={(e) => setMissionForm({ ...missionForm, instructions: e.target.value })}
                      placeholder="Campeones a usar, nodos, gastar o no resurrecciones..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={handleSaveAsTemplate}
                      className="px-3 py-2 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 font-extrabold flex items-center gap-1.5"
                    >
                      <BookmarkPlus className="w-4 h-4" /> Guardar como Plantilla
                    </button>
                    <div className="flex items-center gap-2">
                      <button type="button" onClick={() => setIsMissionModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                      <button type="submit" className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold shadow-lg shadow-indigo-600/30">
                        {editingMission ? 'Guardar Cambios' : 'Registrar Misión'}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: CREAR / EDITAR MERCENARIO                                          */}
          {/* ========================================================================= */}
          {isWorkerModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-extrabold text-white">{editingWorker ? 'Editar Mercenario' : 'Nuevo Mercenario'}</h3>
                  <button onClick={() => setIsWorkerModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleSaveWorker} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Nombre / Nick *</label>
                    <input type="text" required value={workerForm.name} onChange={(e) => setWorkerForm({ ...workerForm, name: e.target.value })} placeholder="Ej. Diego" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Correo de acceso Firebase Auth *</label>
                    <input type="email" required value={workerForm.email} onChange={(e) => setWorkerForm({ ...workerForm, email: e.target.value })} placeholder="mercenario@gmail.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Especialidad</label>
                    <input type="text" value={workerForm.specialty} onChange={(e) => setWorkerForm({ ...workerForm, specialty: e.target.value })} placeholder="Ej. Necrópolis / Actos / Crisol" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-2">Color Identificativo</label>
                    <div className="grid grid-cols-2 gap-2">
                      {WORKER_COLOR_OPTIONS.map(c => (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setWorkerForm({ ...workerForm, color: c.id })}
                          className={`px-3 py-2 rounded-xl border text-left font-bold flex items-center gap-2 ${
                            workerForm.color === c.id ? `${c.badgeClass} ring-2 ring-white/30` : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          <span className={`w-3 h-3 rounded-full ${c.dotClass}`} />
                          <span className="truncate">{c.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsWorkerModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: CONFIRMAR FINALIZACIÓN DE MISIÓN (MERCENARIO)                      */}
          {/* ========================================================================= */}
          {completingMission && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleConfirmCompleteMission} className="bg-slate-900 border border-emerald-500/40 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                  <CheckCircle2 className="w-5 h-5 text-emerald-400" /> Finalizar "{completingMission.missionTitle}"
                </h3>
                <p className="text-xs text-slate-300">
                  Al confirmar, se avisará automáticamente al cliente por WhatsApp y la contraseña se destruirá de la base de datos por seguridad.
                </p>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Nota de finalización (opcional)</label>
                  <textarea
                    rows={2}
                    value={completionNoteInput}
                    onChange={(e) => setCompletionNoteInput(e.target.value)}
                    placeholder="Ej. Completado sin gastar orbes..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setCompletingMission(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Cancelar</button>
                  <button type="submit" className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold">Confirmar 100%</button>
                </div>
              </form>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: CONFIGURACIÓN DEL BOT DE WHATSAPP (MAKE.COM WEBHOOK)               */}
          {/* ========================================================================= */}
          {isBotModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveBotSettings} className="bg-slate-900 border border-cyan-500/40 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl text-xs">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <Bot className="w-5 h-5 text-cyan-400" /> Automatización WhatsApp (Make.com + Meta)
                  </h3>
                  <button type="button" onClick={() => setIsBotModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div>
                  <label className="block font-bold text-slate-300 mb-1">URL del Webhook de Make.com</label>
                  <input
                    type="url"
                    value={automationSettings.makeWebhookUrl || ''}
                    onChange={(e) => setAutomationSettings({ ...automationSettings, makeWebhookUrl: e.target.value })}
                    placeholder="https://hook.eu2.make.com/..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white font-mono"
                  />
                </div>

                <div className="space-y-2 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                  <label className="flex items-center justify-between cursor-pointer">
                    <span className="font-bold text-emerald-400">Activar envíos automáticos de WhatsApp</span>
                    <input type="checkbox" checked={!!automationSettings.enabled} onChange={(e) => setAutomationSettings({ ...automationSettings, enabled: e.target.checked })} />
                  </label>
                  <label className="flex items-center justify-between cursor-pointer text-slate-300">
                    <span>Avisar al Empezar Misión (mision_iniciada)</span>
                    <input type="checkbox" checked={!!automationSettings.notifyOnStart} onChange={(e) => setAutomationSettings({ ...automationSettings, notifyOnStart: e.target.checked })} />
                  </label>
                  <label className="flex items-center justify-between cursor-pointer text-slate-300">
                    <span>Avisar al Pausar Misión (mision_pausada)</span>
                    <input type="checkbox" checked={!!automationSettings.notifyOnPause} onChange={(e) => setAutomationSettings({ ...automationSettings, notifyOnPause: e.target.checked })} />
                  </label>
                  <label className="flex items-center justify-between cursor-pointer text-slate-300">
                    <span>Avisar al Reanudar Misión (mision_reanudada)</span>
                    <input type="checkbox" checked={!!automationSettings.notifyOnResume} onChange={(e) => setAutomationSettings({ ...automationSettings, notifyOnResume: e.target.checked })} />
                  </label>
                  <label className="flex items-center justify-between cursor-pointer text-slate-300">
                    <span>Avisar al Marcar Subtarea del Checklist</span>
                    <input type="checkbox" checked={!!automationSettings.notifyOnChecklist} onChange={(e) => setAutomationSettings({ ...automationSettings, notifyOnChecklist: e.target.checked })} />
                  </label>
                  <label className="flex items-center justify-between cursor-pointer text-slate-300">
                    <span>Avisar al Completar al 100% (mision_completada)</span>
                    <input type="checkbox" checked={!!automationSettings.notifyOnComplete} onChange={(e) => setAutomationSettings({ ...automationSettings, notifyOnComplete: e.target.checked })} />
                  </label>
                </div>

                <div className="flex items-center justify-between gap-2 pt-2">
                  <button type="button" onClick={handleTestMakeWebhook} className="px-3 py-2.5 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-extrabold flex items-center gap-1.5">
                    <Send className="w-3.5 h-3.5" /> Probar Webhook
                  </button>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setIsBotModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold">Cerrar</button>
                    <button type="submit" className="px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold">Guardar</button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODALES DE CONFIRMACIÓN DE BORRADO                                        */}
          {/* ========================================================================= */}
          {(missionToDelete || workerToDelete || tagToDelete) && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/40 rounded-3xl max-w-sm w-full p-6 space-y-4 text-center shadow-2xl">
                <Trash2 className="w-10 h-10 text-rose-500 mx-auto" />
                <h3 className="text-base font-extrabold text-white">¿Confirmar eliminación?</h3>
                <p className="text-xs text-slate-400">
                  {missionToDelete && `Se eliminará la misión "${missionToDelete.missionTitle}" de ${missionToDelete.clientName}.`}
                  {workerToDelete && `Se eliminará el perfil del mercenario "${workerToDelete.name}".`}
                  {tagToDelete && `Se eliminará la etiqueta "${tagToDelete.name}".`}
                </p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => { setMissionToDelete(null); setWorkerToDelete(null); setTagToDelete(null); }}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (missionToDelete) handleDeleteMission();
                      else if (workerToDelete) handleDeleteWorker();
                      else if (tagToDelete) handleDeleteTag();
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-extrabold text-white"
                  >
                    Sí, Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
