    // Limpia el teléfono para la API Oficial de Meta (solo dígitos con prefijo de país, ej: 34600112233)
    const sanitizePhoneForMeta = (rawPhone) => {
      if (!rawPhone) return '';
      let digits = String(rawPhone).replace(/[^\d]/g, '');
      if (digits.startsWith('00')) digits = digits.slice(2);
      // Si pone un móvil español de 9 dígitos (6... o 7...) sin prefijo, le añade 34 automáticamente
      if (digits.length === 9 && (digits.startsWith('6') || digits.startsWith('7'))) {
        digits = '34' + digits;
      }
      return digits;
    };

    const formatPhoneDisplay = (rawPhone) => {

    // Sintetizador de sonido para notificaciones en tiempo real (sin archivos externos)
    const playNotificationSound = (type = 'default') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'completed') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (type === 'removed') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(311.13, now + 0.14);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    };

    const isExcludedInternalClient = (name) => {
      if (!name) return true;
      const clean = name.trim().toLowerCase();
      return clean === 'acumulado whatsapp' || clean.includes('acumulado whatsapp');
    };

    const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const getCurrentMonthYear = (dateObj = new Date()) => `${MONTH_NAMES[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    const parseMonthYearSortValue = (str) => {
      if (!str) return 0;
      const parts = str.trim().split(' ');
      if (parts.length < 2) return 0;
      const mIndex = MONTH_NAMES.findIndex(m => m.toLowerCase() === parts[0].toLowerCase());
      const year = parseInt(parts[1], 10) || 0;
      return year * 100 + (mIndex >= 0 ? mIndex : 0);
    };
    const formatAddedDate = (ts) => {
      if (!ts) return '';
      try { return new Date(Number(ts)).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
    };

    const formatDuration = (ms) => {
      if (!ms || ms <= 0) return 'N/D';
      const mins = Math.max(1, Math.floor(ms / 60000));
      const hrs = Math.floor(mins / 60);
      const remMins = mins % 60;
      if (hrs === 0) return `${remMins}m`;
      return `${hrs}h ${remMins}m`;
    };

    const getMissionEffectiveWorkMs = (m, nowTs = Date.now()) => {
      const baseAccumulated = Number(m.accumulatedWorkMs) || 0;
      if (m.status === 'En Progreso' && m.lastResumedAt) {
        return baseAccumulated + Math.max(0, nowTs - Number(m.lastResumedAt));
      }
      if (baseAccumulated > 0) {
        return baseAccumulated;
      }
      if (m.startedAt && m.completedAt && Number(m.completedAt) > Number(m.startedAt)) {
        return Number(m.completedAt) - Number(m.startedAt);
      }
      if (m.status === 'En Progreso' && m.startedAt) {
        return Math.max(0, nowTs - Number(m.startedAt));
      }
      return 0;
    };

    function App() {

      const [missions, setMissions] = useState([]);
      const [tags, setTags] = useState([]);

      const [automationSettings, setAutomationSettings] = useState({

        enabled: true,

      const [isBotModalOpen, setIsBotModalOpen] = useState(false);

      const [authUser, setAuthUser] = useState(null); 
      const [isAuthChecking, setIsAuthChecking] = useState(true);
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [showPwaHint, setShowPwaHint] = useState(false);

      const [isNotifPanelOpen, setIsNotifPanelOpen] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [browserNotifPermission, setBrowserNotifPermission] = useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'

      const [liveBannerAlert, setLiveBannerAlert] = useState(null);
      const knownNotifIdsRef = useRef(new Set());

      const [workerTab, setWorkerTab] = useState('queue');

      const [missionForm, setMissionForm] = useState({

      const [workerForm, setWorkerForm] = useState({
        name: '', email: '', specialty: '', color: WORKER_COLOR_OPTIONS[0].id
      });

      useEffect(() => {
        if (!auth) return;
        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setAuthUser(user);
          setIsAuthChecking(false);
          knownNotifIdsRef.current = new Set();
          initialNotifLoadDoneRef.current = false;
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!db || !authUser) return;

        const unsubMissions = onSnapshot(collection(db, "missions"), (snapshot) => {
          const cloudMissions = [];
          snapshot.forEach((docSnap) => cloudMissions.push({ id: docSnap.id, ...docSnap.data() }));
          setMissions(cloudMissions);
        });

        const unsubWorkers = onSnapshot(collection(db, "workers"), (snapshot) => {
          const cloudWorkers = [];
          snapshot.forEach((docSnap) => cloudWorkers.push({ id: docSnap.id, ...docSnap.data() }));
          setWorkers(cloudWorkers);
        });

        const unsubTags = onSnapshot(collection(db, "tags"), (snapshot) => {
          const cloudTags = [];
          snapshot.forEach((docSnap) => cloudTags.push({ id: docSnap.id, ...docSnap.data() }));
          setTags(cloudTags);
        });

        const unsubNotifications = onSnapshot(collection(db, "notifications"), (snapshot) => {
          const cloudNotifs = [];
          snapshot.forEach((docSnap) => cloudNotifs.push({ id: docSnap.id, ...docSnap.data() }));
          setNotifications(cloudNotifs);
        });

        const unsubSettings = onSnapshot(doc(db, "settings", "whatsapp_automation"), (docSnap) => {
          if (docSnap.exists()) {
            setAutomationSettings(prev => ({ ...prev, ...docSnap.data() }));
          }
        });

        return () => {
          unsubMissions();
          unsubWorkers();
          unsubTags();
          unsubNotifications();
          unsubSettings();
        };
      }, [authUser]);

      const showToast = (msg) => {
        setToastMessage({ text: msg });
        setTimeout(() => setToastMessage(null), 3500);
      };

      // =========================================================================
      // MOTOR DE AUTOMATIZACIÓN FANTASMA DE WHATSAPP (FIREBASE QUEUE + MAKE WEBHOOK)
      // =========================================================================
      const triggerAutomaticClientWhatsApp = async ({
        mission,
        eventType, // 'mission_started' | 'mission_paused' | 'mission_resumed' | 'checklist_step' | 'mission_completed'
        metaTemplateName, // Nombre sugerido de la plantilla en Meta WhatsApp Cloud API
        stepDetail = '',
        progressText = '',
        notes = ''
      }) => {
        if (!mission || !automationSettings.enabled) return;

        const rawPhone = mission.clientPhone || mission.clientContact || '';
        const cleanMetaPhone = sanitizePhoneForMeta(rawPhone);
        if (!cleanMetaPhone || cleanMetaPhone.length < 8) {
          return; // Si el cliente no tiene número de teléfono válido, no dispara WhatsApp
        }

        // Comprobar si este tipo de evento está activo en la configuración del Bot
        if (eventType === 'mission_started' && !automationSettings.notifyOnStart) return;
        if (eventType === 'mission_paused' && !automationSettings.notifyOnPause) return;
        if (eventType === 'mission_resumed' && !automationSettings.notifyOnResume) return;
        if (eventType === 'checklist_step' && !automationSettings.notifyOnChecklist) return;
        if (eventType === 'mission_completed' && !automationSettings.notifyOnComplete) return;

        // Textos automáticos listos para enviar o inyectar como variables {{1}}, {{2}}, {{3}} en Meta
        let fullMessageText = '';
        if (eventType === 'mission_started') {
          fullMessageText = `¡Hola ${mission.clientName}! 🎮 Nuestro mercenario acaba de entrar a tu cuenta para empezar la misión "${mission.missionTitle}". Por favor, no abras el juego mientras esté en curso para evitar desconexiones. ¡Te avisaremos por aquí en cuanto pausemos o terminemos!`;
        } else if (eventType === 'mission_paused') {
          fullMessageText = `¡Hola ${mission.clientName}! ⏸️ Hemos puesto en pausa temporalmente tu misión "${mission.missionTitle}". Tienes tu cuenta 100% libre para entrar a jugar con normalidad. Te avisaremos por aquí cuando volvamos a retomarla.`;
        } else if (eventType === 'mission_resumed') {
          fullMessageText = `¡Hola ${mission.clientName}! ▶️ Nuestro mercenario vuelve a entrar a tu cuenta para continuar con la misión "${mission.missionTitle}". Por favor, no entres al juego hasta nuevo aviso.`;
        } else if (eventType === 'checklist_step') {
          fullMessageText = `¡Hola ${mission.clientName}! ☑️ Nuevo avance en tu misión "${mission.missionTitle}": acabamos de completar "${stepDetail}" (Progreso total: ${progressText}). ¡Seguimos avanzando!`;
        } else if (eventType === 'mission_completed') {
          fullMessageText = `¡Hola ${mission.clientName}! 🚀 ¡Enhorabuena! Tu misión "${mission.missionTitle}" ya está 100% COMPLETADA. Ya puedes entrar a tu cuenta y disfrutar de las recompensas. ¡Muchas gracias por tu confianza!`;
        }

        const now = Date.now();
        const queueId = `wa-${now}-${Math.random().toString(36).slice(2, 7)}`;

        const payload = {
          id: queueId,
          timestamp: now,
          isoDate: new Date(now).toISOString(),
          eventType,
          metaTemplateName,
          toPhoneMeta: cleanMetaPhone, // Formato oficial Meta sin '+' (ej: 34611223344)
          toPhoneE164: `+${cleanMetaPhone}`,
          clientName: mission.clientName || 'Cliente',
          missionTitle: mission.missionTitle || 'Misión',
          stepDetail: stepDetail || 'Completado',
          progressText: progressText || '100%',
          notes: notes || 'Completado con éxito',
          fullMessageText,
          // Variables listas para mapear en los parámetros {{1}}, {{2}}, {{3}} de la plantilla de Meta
          templateParam1: mission.clientName || 'Cliente',
          templateParam2: mission.missionTitle || 'Misión',
          templateParam3: stepDetail || progressText || notes || 'Listo'
        };

        // 1. Guardar en la colección "whatsapp_queue" de Firebase (por si Make escucha Firestore)
        if (db) {
          try {
            await setDoc(doc(db, "whatsapp_queue", queueId), payload);
          } catch (e) {
            console.error("Error guardando en whatsapp_queue:", e);
          }
        }

        // 2. Disparar Webhook directo e instantáneo a Make.com en segundo plano ("Fantasma")
        if (automationSettings.makeWebhookUrl && automationSettings.makeWebhookUrl.startsWith('http')) {
          try {
            fetch(automationSettings.makeWebhookUrl.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).catch(() => {});
          } catch (e) {}
        }
      };

      const handleSaveBotSettings = async (e) => {
        e.preventDefault();
        if (db) {
          try {
            await setDoc(doc(db, "settings", "whatsapp_automation"), automationSettings, { merge: true });
            showToast('🤖 Configuración del Bot de WhatsApp guardada');
            setIsBotModalOpen(false);
          } catch (err) {
            console.error(err);

      const creatorFilteredMissions = useMemo(() => {

            } else if (statusFilter !== 'ALL' && m.status !== statusFilter) return false;
            if (tagFilter !== 'ALL' && !getMissionTagIds(m).includes(tagFilter)) return false;
            if (workerFilter !== 'ALL' && m.workerId !== workerFilter) return false;
            if (paymentFilter !== 'ALL' && getMissionPaymentMethod(m) !== paymentFilter) return false;
            if (searchQuery.trim() && !m.clientName.toLowerCase().includes(searchQuery.toLowerCase()) && !m.missionTitle.toLowerCase().includes(searchQuery.toLowerCase()) && !(m.accountUser || '').toLowerCase().includes(searchQuery.toLowerCase())) return false;
            return true;
          })
          .sort((a, b) => {
            if (statusFilter === 'Completada' || (a.status === 'Completada' && b.status === 'Completada')) {
              const closeDiff = getMissionClosedTimestamp(b) - getMissionClosedTimestamp(a);
              if (closeDiff !== 0) return closeDiff;

      const creatorFinancialsByMonth = useMemo(() => {
        const summary = {};
        availableMonths.forEach(month => {
          const monthMissions = missions.filter(m => m.monthYear === month);

          const calcModalityStats = (list) => {
            const revenueEUR = list.reduce((acc, m) => acc + (Number(m.priceTotalEUR) || 0), 0);
            const workerCostUSD = list
              .filter(m => m.status === 'Completada' && m.workerId !== 'unassigned')
              .reduce((acc, m) => acc + (Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0), 0);
            const workerCostEUR = workerCostUSD * 0.92;
            const netProfitEUR = revenueEUR - workerCostEUR;
            return {
              revenueEUR,
              workerCostUSD,
              netProfitEUR,
              count: list.length
            };
          };

          const totalStats = calcModalityStats(monthMissions);
          const bizumMissions = monthMissions.filter(m => getMissionPaymentMethod(m) === 'Bizum');
          const paypalMissions = monthMissions.filter(m => getMissionPaymentMethod(m) === 'PayPal');

          summary[month] = {
            totalEUR: totalStats.revenueEUR,
            totalUSDWorkerCost: totalStats.workerCostUSD,
            netProfitEUR: totalStats.netProfitEUR,
            missionCount: monthMissions.length,
            bizum: calcModalityStats(bizumMissions),
            paypal: calcModalityStats(paypalMissions)

        return summary;
      }, [missions, availableMonths]);

      const tagAnalytics = useMemo(() => {

        const totalMissionsInPeriod = filteredMissions.length;

        const statsList = tags.map(t => {
          const matchingMissions = filteredMissions.filter(m => getMissionTagIds(m).includes(t.id));
          const count = matchingMissions.length;
          const revenueEUR = matchingMissions.reduce((acc, m) => acc + (Number(m.priceTotalEUR) || 0), 0);
          const workerCostUSD = matchingMissions.reduce((acc, m) => acc + (Number(m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD) || 0), 0);
          
          const workerCostEUR = workerCostUSD * 0.92;
          const netProfitEUR = revenueEUR - workerCostEUR;
          const percentage = totalMissionsInPeriod > 0 ? Math.round((count / totalMissionsInPeriod) * 100) : 0;

          return { ...t, count, revenueEUR, workerCostUSD, workerCostEUR, netProfitEUR, percentage };
        }).sort((a, b) => b.count !== a.count ? b.count - a.count : b.revenueEUR - a.revenueEUR);

        const maxCount = statsList.length > 0 ? Math.max(...statsList.map(s => s.count), 1) : 1;
        return { statsList, totalMissionsInPeriod, maxCount };

      const knownClientsDatabase = useMemo(() => {

        sorted.forEach(m => {

          if (!rawName || isExcludedInternalClient(rawName)) return;
          const key = rawName.toLowerCase();
          const phoneVal = m.clientPhone || m.clientContact || '';

          if (!clientMap.has(key)) {
            clientMap.set(key, {
              clientName: rawName,
              clientPhone: phoneVal,
              clientContact: phoneVal,
              accountUser: m.accountUser || '',
              accountPass: m.accountPass || '',
              loginMethod: m.loginMethod || 'Kabam ID',
              paymentMethod: getMissionPaymentMethod(m),
              workerId: m.workerId || 'unassigned',
              missionsCount: 1,
              totalSpentEUR: Number(m.priceTotalEUR) || 0

            const existing = clientMap.get(key);
            existing.missionsCount += 1;
            existing.totalSpentEUR += (Number(m.priceTotalEUR) || 0);
            if (!existing.clientPhone && phoneVal) existing.clientPhone = phoneVal;
            if (!existing.clientContact && phoneVal) existing.clientContact = phoneVal;
            if (!existing.accountUser && m.accountUser) existing.accountUser = m.accountUser;
            if (!existing.accountPass && m.accountPass) existing.accountPass = m.accountPass;
            if (!existing.loginMethod && m.loginMethod) existing.loginMethod = m.loginMethod;

                missionTitle: mission.missionTitle,
                clientName: mission.clientName
              });
            }

            // Disparo automático de WhatsApp al cliente informando del objetivo completado
            await triggerAutomaticClientWhatsApp({
              mission,
              eventType: 'checklist_step',
              metaTemplateName: 'avance_mision',
              stepDetail: toggledItem.text,
              progressText: progressStr
            });
          }
          showToast(`☑️ Progreso actualizado (${doneCount}/${updatedList.length})`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleLiquidateWorker = async (workerId) => {
        const worker = workers.find(w => w.id === workerId);
        if (!worker) return;

        const pendingMissionsToPay = missions.filter(m => m.workerId === workerId && m.status === 'Completada' && Number(m.workerPayUSD) > 0);
        const amountUSD = pendingMissionsToPay.reduce((acc, m) => acc + (Number(m.workerPayUSD) || 0), 0);

        if (amountUSD <= 0) { showToast(`⚠️ ${worker.name} no tiene saldo pendiente`); return; }

        const newPaidEntry = { month: `${getCurrentMonthYear()} (Liquidado)`, amountPaidUSD: amountUSD, missionsCount: pendingMissionsToPay.length };
        const updatedPaidHistory = [...(worker.paidHistory || []), newPaidEntry];

        if (db) {
          await setDoc(doc(db, "workers", workerId), { ...worker, paidHistory: updatedPaidHistory }, { merge: true });
          for (const pm of pendingMissionsToPay) {
            await setDoc(doc(db, "missions", pm.id), { originalWorkerPayUSD: pm.workerPayUSD, workerPayUSD: 0, isPaidToWorker: true }, { merge: true });
          }
          await pushCloudNotification({
            recipient: workerId,
            title: '💸 ¡Pago Liquidado!',
            message: `El Creador ha liquidado tu saldo pendiente de $${amountUSD} USD (${pendingMissionsToPay.length} misiones).`,
            eventType: 'completed',
            missionTitle: `Liquidación ${getCurrentMonthYear()}`,
            clientName: ''
          });
        }
        showToast(`💸 ¡Liquidación de $${amountUSD} efectuada a ${worker.name}!`);
      };

      const handleSaveMission = async (e) => {
        e.preventDefault();
        if (!missionForm.clientName.trim() || !missionForm.missionTitle.trim()) { showToast('⚠️ Faltan datos requeridos'); return; }

        let finalChecklist = Array.isArray(missionForm.checklist) ? [...missionForm.checklist] : [];
        if (newChecklistItemText.trim()) {
          finalChecklist.push({
            id: `chk-${Date.now()}`,
            text: newChecklistItemText.trim(),
            done: false
          });
          setNewChecklistItemText('');
        }

        const rawPhoneInput = (missionForm.clientPhone || missionForm.clientContact || '').trim();
        const sanitizedMetaPhone = sanitizePhoneForMeta(rawPhoneInput);
        const formattedPhone = sanitizedMetaPhone ? `+${sanitizedMetaPhone}` : rawPhoneInput;

        const targetMonthYear = editingMission ? (editingMission.monthYear || getCurrentMonthYear()) : getCurrentMonthYear();
        const payload = {
          ...missionForm,
          clientPhone: formattedPhone,
          clientPhoneMeta: sanitizedMetaPhone,
          clientContact: formattedPhone,
          priceTotalEUR: Number(missionForm.priceTotalEUR) || 0,
          workerPayUSD: Number(missionForm.workerPayUSD) || 0,
          paymentMethod: missionForm.paymentMethod === 'PayPal' ? 'PayPal' : 'Bizum',
          tags: Array.isArray(missionForm.tags) ? missionForm.tags : [],
          checklist: finalChecklist,
          monthYear: targetMonthYear
        };

        if (editingMission) {
          const prevWorkerId = editingMission.workerId || 'unassigned';
          const nextWorkerId = payload.workerId || 'unassigned';

          if (db) {
            await setDoc(doc(db, "missions", editingMission.id), { ...editingMission, ...payload }, { merge: true });

            if (prevWorkerId !== nextWorkerId) {
              if (prevWorkerId !== 'unassigned') {
                await pushCloudNotification({
                  recipient: prevWorkerId,
                  title: '⚠️ Misión Retirada',
                  message: `Se te ha retirado la misión "${payload.missionTitle}" del cliente ${payload.clientName}.`,
                  eventType: 'removed',
                  missionTitle: payload.missionTitle,
                  clientName: payload.clientName
                });
              }
              if (nextWorkerId !== 'unassigned') {
                await pushCloudNotification({
                  recipient: nextWorkerId,
                  title: '🎯 Nueva Misión Asignada',
                  message: `Tienes asignada la misión "${payload.missionTitle}" (Cliente: ${payload.clientName} • Pago: $${payload.workerPayUSD} USD).`,
                  eventType: 'assigned',
                  missionTitle: payload.missionTitle,
                  clientName: payload.clientName
                });
              }
            }
          }
          showToast('✅ Misión actualizada');
        } else {
          const nowTs = Date.now();
          const newId = `mission-${nowTs}`;
          const newM = {
            ...payload,
            id: newId,
            status: 'Pendiente',
            orderIndex: missions.length + 1,
            createdAt: nowTs,
            startedAt: null,
            lastResumedAt: null,
            accumulatedWorkMs: 0,
            completedAt: null,
            completionNotes: ''
          };
          if (db) {
            await setDoc(doc(db, "missions", newId), newM);

            if (payload.workerId && payload.workerId !== 'unassigned') {
              await pushCloudNotification({
                recipient: payload.workerId,
                title: '🎯 Nueva Misión Asignada',
                message: `El Creador te ha asignado "${payload.missionTitle}" (Cliente: ${payload.clientName} • Pago: $${payload.workerPayUSD} USD).`,
                eventType: 'assigned',
                missionTitle: payload.missionTitle,
                clientName: payload.clientName
              });
            }
          }
          setMonthFilter(targetMonthYear);
          if (statusFilter === 'Completada') setStatusFilter('ACTIVE');
          showToast(`✅ Misión registrada (${payload.paymentMethod})`);
        }
        setIsMissionModalOpen(false);
      };

      const handleQuickWorkerReassign = async (mission, newWorkerId) => {
        if (!db) return;
        const oldWorkerId = mission.workerId || 'unassigned';
        if (oldWorkerId === newWorkerId) return;

        try {
          await setDoc(doc(db, "missions", mission.id), { workerId: newWorkerId }, { merge: true });

          const oldWorkerObj = workers.find(w => w.id === oldWorkerId);
          const newWorkerObj = workers.find(w => w.id === newWorkerId);

          if (oldWorkerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: oldWorkerId,
              title: '⚠️ Misión Retirada de tu Cola',
              message: `El Creador ha retirado o reasignado la misión "${mission.missionTitle}" (Cliente: ${mission.clientName}).`,
              eventType: 'removed',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          if (newWorkerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: newWorkerId,
              title: '🎯 Nueva Misión Asignada',
              message: `El Creador te ha asignado "${mission.missionTitle}" (Cliente: ${mission.clientName} • Pago: $${mission.workerPayUSD} USD).`,
              eventType: 'assigned',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          if (newWorkerObj) {
            showToast(`🥷 Misión asignada a ${newWorkerObj.name} (Notificado)`);
          } else if (oldWorkerObj) {
            showToast(`⚠️ Misión retirada a ${oldWorkerObj.name} (Notificado)`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleCreatorQuickStatusChange = async (mission, newStatus) => {
        if (!db || mission.status === newStatus) return;
        const now = Date.now();
        let accumulated = Number(mission.accumulatedWorkMs) || 0;
        if (mission.status === 'En Progreso') {
          const startRef = Number(mission.lastResumedAt || mission.startedAt || now);
          accumulated += Math.max(0, now - startRef);
        }

        const updatePayload = {
          status: newStatus,
          accumulatedWorkMs: accumulated,
          lastResumedAt: newStatus === 'En Progreso' ? now : null,
          startedAt: mission.startedAt || (newStatus === 'En Progreso' ? now : null),
          completedAt: newStatus === 'Completada' ? now : (mission.completedAt || null)
        };

        try {
          await setDoc(doc(db, "missions", mission.id), updatePayload, { merge: true });

          if (mission.workerId && mission.workerId !== 'unassigned') {
            await pushCloudNotification({
              recipient: mission.workerId,
              title: `🔄 Estado cambiado a ${newStatus}`,
              message: `El Creador cambió el estado de "${mission.missionTitle}" (${mission.clientName}) a ${newStatus}.`,
              eventType: newStatus === 'Completada' ? 'completed' : 'status_changed',
              missionTitle: mission.missionTitle,
              clientName: mission.clientName
            });
          }

          // Disparar WhatsApp automático al cliente también si el Creador cambia el estado manualmente
          if (newStatus === 'En Pausa') {
            await triggerAutomaticClientWhatsApp({ mission, eventType: 'mission_paused', metaTemplateName: 'mision_pausada' });
          } else if (newStatus === 'En Progreso') {
            const wasPaused = mission.status === 'En Pausa';
            await triggerAutomaticClientWhatsApp({
              mission,
              eventType: wasPaused ? 'mission_resumed' : 'mission_started',
              metaTemplateName: wasPaused ? 'mision_reanudada' : 'mision_iniciada'
            });
          } else if (newStatus === 'Completada') {
            await triggerAutomaticClientWhatsApp({ mission, eventType: 'mission_completed', metaTemplateName: 'mision_completada' });
          }

          showToast(`Estado cambiado a ${newStatus}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleQuickTogglePaymentMethod = async (mission) => {
        if (!db) return;
        const currentMethod = getMissionPaymentMethod(mission);
        const nextMethod = currentMethod === 'Bizum' ? 'PayPal' : 'Bizum';
        try {
          await setDoc(doc(db, "missions", mission.id), { paymentMethod: nextMethod }, { merge: true });
          showToast(`💳 Método cambiado a ${nextMethod}`);
        } catch (err) {
          console.error(err);
        }
      };

      // Cuando el Mercenario empieza o reanuda la misión -> Dispara WhatsApp Fantasma al Cliente
      const handleStartMission = async (mission) => {
        const now = Date.now();
        const isResuming = mission.status === 'En Pausa';
        if (db) {
          await setDoc(doc(db, "missions", mission.id), {
            status: 'En Progreso',
            startedAt: mission.startedAt || now,
            lastResumedAt: now
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: isResuming ? `▶️ ${workerName} reanudó la misión` : `⚡ ${workerName} empezó una misión`,
            message: isResuming
              ? `${workerName} ha vuelto a entrar a la cuenta de ${mission.clientName} para continuar "${mission.missionTitle}".`
              : `${workerName} ha puesto EN CURSO "${mission.missionTitle}" del cliente ${mission.clientName}.`,
            eventType: 'started',
            missionTitle: mission.missionTitle,
            clientName: mission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission,
            eventType: isResuming ? 'mission_resumed' : 'mission_started',
            metaTemplateName: isResuming ? 'mision_reanudada' : 'mision_iniciada'
          });
        }
        showToast(isResuming ? '▶️ Misión reanudada' : '▶️ Misión puesta En Curso');
      };

      // Cuando el Mercenario pausa la misión -> Dispara WhatsApp Fantasma al Cliente (Cuenta Libre)
      const handlePauseMission = async (mission) => {
        const now = Date.now();
        const startRef = Number(mission.lastResumedAt || mission.startedAt || now);
        const sessionElapsed = Math.max(0, now - startRef);
        const newAccumulated = (Number(mission.accumulatedWorkMs) || 0) + sessionElapsed;

        if (db) {
          await setDoc(doc(db, "missions", mission.id), {
            status: 'En Pausa',
            accumulatedWorkMs: newAccumulated,
            lastResumedAt: null,
            lastPausedAt: now
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: `⏸️ Misión Pausada (${mission.clientName} puede entrar)`,
            message: `${workerName} ha pausado "${mission.missionTitle}". Cuenta libre para el cliente ${mission.clientName}. (Tiempo trabajado: ${formatDuration(newAccumulated)}).`,
            eventType: 'status_changed',
            missionTitle: mission.missionTitle,
            clientName: mission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission,
            eventType: 'mission_paused',
            metaTemplateName: 'mision_pausada'
          });
        }
        showToast('⏸️ Misión en pausa (Cliente avisado automáticamente)');
      };

      const handlePrioritizeMission = async (mission) => {
        if (!activeWorkerQueue || activeWorkerQueue.length === 0) return;
        const minPrio = Math.min(...activeWorkerQueue.map(m => m.workerPriorityOrder !== undefined ? Number(m.workerPriorityOrder) : 0));
        if (db) { await setDoc(doc(db, "missions", mission.id), { workerPriorityOrder: minPrio - 1 }, { merge: true }); }
        showToast('⬆️ Misión priorizada');
      };

      // Cuando el Mercenario completa la misión -> Dispara WhatsApp Fantasma al Cliente (100% Completada)
      const handleConfirmCompleteMission = async (e) => {
        e.preventDefault();
        if (!completingMission) return;
        const now = Date.now();
        const finalNote = completionNoteInput.trim() || 'Completado con éxito.';

        let totalEffectiveMs = Number(completingMission.accumulatedWorkMs) || 0;
        if (completingMission.status === 'En Progreso') {
          const startRef = Number(completingMission.lastResumedAt || completingMission.startedAt || now);
          totalEffectiveMs += Math.max(0, now - startRef);
        } else if (totalEffectiveMs === 0 && completingMission.startedAt) {
          totalEffectiveMs = Math.max(0, now - Number(completingMission.startedAt));
        }

        const updatedChecklist = getMissionChecklist(completingMission).map(item => ({ ...item, done: true }));

        if (db) {
          await setDoc(doc(db, "missions", completingMission.id), {
            status: 'Completada',
            completedAt: now,
            lastResumedAt: null,
            accumulatedWorkMs: totalEffectiveMs,
            checklist: updatedChecklist,
            completionNotes: finalNote
          }, { merge: true });

          const workerName = currentIsolatedWorker?.name || 'Un mercenario';
          await pushCloudNotification({
            recipient: 'creator',
            title: `✅ ¡${workerName} completó una misión!`,
            message: `${workerName} ha finalizado "${completingMission.missionTitle}" (Cliente: ${completingMission.clientName} • Tiempo efectivo: ${formatDuration(totalEffectiveMs)}). Nota: "${finalNote}"`,
            eventType: 'completed',
            missionTitle: completingMission.missionTitle,
            clientName: completingMission.clientName
          });

          await triggerAutomaticClientWhatsApp({
            mission: completingMission,
            eventType: 'mission_completed',
            metaTemplateName: 'mision_completada',
            notes: finalNote
          });
        }
        showToast('✅ ¡Misión finalizada! Cliente y Creador notificados');
        setCompletingMission(null);
        setCompletionNoteInput('');
      };

      const handleDeleteMission = async () => {
        if (!missionToDelete) return;
        if (db) {
          const prevWorkerId = missionToDelete.workerId;
          const wasActive = missionToDelete.status !== 'Completada';
          await deleteDoc(doc(db, "missions", missionToDelete.id));

          if (prevWorkerId && prevWorkerId !== 'unassigned' && wasActive) {
            await pushCloudNotification({
              recipient: prevWorkerId,
              title: '🗑️ Misión Eliminada de tu Cola',
              message: `El Creador ha eliminado la misión "${missionToDelete.missionTitle}" (Cliente: ${missionToDelete.clientName}).`,
              eventType: 'removed',
              missionTitle: missionToDelete.missionTitle,
              clientName: missionToDelete.clientName
            });
          }
        }
        showToast('🗑️ Misión eliminada');
        setMissionToDelete(null);
      };

      const handleSaveWorker = async (e) => {
        e.preventDefault();
        if (!workerForm.name.trim() || !workerForm.email.trim()) { showToast('⚠️ Introduce nombre y Correo Firebase'); return; }
        
        const cleanEmail = workerForm.email.trim().toLowerCase();

        if (editingWorker) {
          if (db) { await setDoc(doc(db, "workers", editingWorker.id), { ...editingWorker, name: workerForm.name.trim(), email: cleanEmail, specialty: workerForm.specialty.trim(), color: workerForm.color }, { merge: true }); }
          showToast(`🥷 Mercenario ${workerForm.name} actualizado`);
        } else {
          const newId = `worker-${Date.now()}`;
          const newW = { id: newId, name: workerForm.name.trim(), email: cleanEmail, specialty: workerForm.specialty.trim() || 'Mercenario', color: workerForm.color || WORKER_COLOR_OPTIONS[0].id, paidHistory: [] };
          if (db) { await setDoc(doc(db, "workers", newId), newW); }
          showToast(`🥷 Mercenario ${newW.name} creado`);
        }
        setIsWorkerModalOpen(false);
      };

      const handleQuickWorkerColorChange = async (worker, newColorId) => {
        if (!db) return;
        try {
          await setDoc(doc(db, "workers", worker.id), { ...worker, color: newColorId }, { merge: true });
          const colorMeta = getWorkerColorMeta(newColorId);
          showToast(`🎨 Color de ${worker.name}: ${colorMeta.label}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleDeleteWorker = async () => {
        if (!workerToDelete) return;
        if (db) {
          await deleteDoc(doc(db, "workers", workerToDelete.id));
          const workerMissions = missions.filter(m => m.workerId === workerToDelete.id);
          for (const wm of workerMissions) { await setDoc(doc(db, "missions", wm.id), { workerId: 'unassigned' }, { merge: true }); }
        }
        showToast('🗑️ Mercenario eliminado');
        setWorkerToDelete(null);
      };

      const copyToClipboard = (text, label) => {
        if (!text) return;
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
        showToast(`📋 ${label} copiado`);
      };

      const toggleCredentials = (id) => setVisibleCredentials(prev => ({ ...prev, [id]: !prev[id] }));

      const getPriorityBadge = (priority) => {
        if (priority === 'Urgente') return <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">URGENTE</span>;
        if (priority === 'VIP') return <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">VIP</span>;
        return <span className="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-300">Normal</span>;
      };

      const getStatusBadge = (status) => {
        if (status === 'En Progreso') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" /> ⚡ En Curso</span>;
        if (status === 'En Pausa') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 flex items-center gap-1">⏸️ En Pausa (Cliente Libre)</span>;
        if (status === 'Completada') return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center gap-1">✓ Completada</span>;
        return <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 flex items-center gap-1">⏳ Pendiente</span>;
      };

      const renderPaymentMethodBadge = (mission) => {
        const method = getMissionPaymentMethod(mission);
        const isPaypal = method === 'PayPal';
        return (
          <button
            type="button"
            onClick={() => handleQuickTogglePaymentMethod(mission)}
            title="Clic para cambiar rápido entre Bizum y PayPal"
            className={`px-2.5 py-0.5 rounded text-[10px] font-extrabold border flex items-center gap-1 transition ${
              isPaypal
                ? 'bg-blue-500/20 text-blue-300 border-blue-500/40 hover:bg-blue-500/30'
                : 'bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30'
            }`}
          >
            <span className={`w-1.5 h-1.5 rounded-full ${isPaypal ? 'bg-blue-400' : 'bg-rose-400'}`} />
            {isPaypal ? '💳 PayPal' : '📱 Bizum'}
          </button>
        );
      };

      const renderMissionTags = (mission) => {
        const missionTagIds = getMissionTagIds(mission);
        if (missionTagIds.length === 0) return null;
        return missionTagIds.map(tId => {
          const tagObj = tags.find(t => t.id === tId);
          if (!tagObj) return null;
          const colorMeta = getTagColorMeta(tagObj.color);
          return (
            <span key={tId} className={`px-2 py-0.5 rounded text-[10px] font-bold border flex items-center gap-1 ${colorMeta.badgeClass}`}>
              <Tag className="w-2.5 h-2.5" /> {tagObj.name}
            </span>
          );
        });
      };

      const renderMissionChecklistBlock = (mission) => {
        const list = getMissionChecklist(mission);
        if (list.length === 0) return null;
        const doneCount = list.filter(i => i.done).length;
        const pct = Math.round((doneCount / list.length) * 100);

        return (
          <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 space-y-2">
            <div className="flex items-center justify-between text-xs">
              <span className="font-extrabold text-amber-300 flex items-center gap-1.5">
                <ListChecks className="w-3.5 h-3.5" /> Progreso de Misión ({doneCount}/{list.length})
              </span>
              <span className="text-[11px] font-bold text-emerald-400">{pct}%</span>
            </div>
            <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-300" style={{ width: `${pct}%` }} />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1">
              {list.map(item => (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => handleToggleMissionChecklistItem(mission, item.id)}
                  className={`px-2.5 py-1.5 rounded-lg border text-left text-xs font-bold flex items-center gap-2 transition ${
                    item.done
                      ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 line-through opacity-85'
                      : 'bg-slate-950 border-slate-800 text-slate-200 hover:border-indigo-500/50'
                  }`}
                >
                  <span className={`w-4 h-4 rounded flex items-center justify-center border shrink-0 ${
                    item.done ? 'bg-emerald-500 border-emerald-400 text-slate-950' : 'border-slate-600 bg-slate-900'
                  }`}>
                    {item.done && <Check className="w-3 h-3 stroke-[3]" />}
                  </span>
                  <span className="truncate">{item.text}</span>
                </button>
              ))}
            </div>
          </div>
        );
      };

      const renderNotificationBell = () => {
        return (
          <div className="relative">
            <button
              type="button"
              onClick={() => setIsNotifPanelOpen(!isNotifPanelOpen)}
              className={`relative p-2.5 rounded-xl border transition flex items-center gap-1.5 ${
                unreadNotifCount > 0
                  ? 'bg-amber-500/15 border-amber-500/50 text-amber-300 hover:bg-amber-500/25'
                  : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
              }`}
              title="Centro de Notificaciones"
            >
              {unreadNotifCount > 0 ? (
                <BellRing className="w-4 h-4 text-amber-400 animate-bounce" />
              ) : (
                <Bell className="w-4 h-4" />
              )}
              {unreadNotifCount > 0 && (
                <span className="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-extrabold">
                  {unreadNotifCount}
                </span>
              )}
            </button>

            {isNotifPanelOpen && (
              <div className="fixed sm:absolute right-3 left-3 sm:left-auto sm:right-0 mt-2 sm:w-96 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl z-50 overflow-hidden">
                <div className="p-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <Bell className="w-4 h-4 text-amber-400" />
                    <span className="text-xs font-extrabold text-white">Notificaciones ({unreadNotifCount} sin leer)</span>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => setSoundEnabled(!soundEnabled)}
                      className={`p-1.5 rounded-lg border text-xs ${
                        soundEnabled ? 'bg-indigo-500/20 border-indigo-500/40 text-indigo-300' : 'bg-slate-900 border-slate-800 text-slate-500'
                      }`}
                      title={soundEnabled ? 'Sonido activado' : 'Sonido silenciado'}
                    >
                      {soundEnabled ? <Volume2 className="w-3.5 h-3.5" /> : <VolumeX className="w-3.5 h-3.5" />}
                    </button>

                    {unreadNotifCount > 0 && (
                      <button
                        type="button"
                        onClick={handleMarkAllNotifsAsRead}
                        className="px-2 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold flex items-center gap-1"
                        title="Marcar todas como leídas"
                      >
                        <CheckCheck className="w-3 h-3" /> Leer todas
                      </button>
                    )}

                    <button
                      type="button"
                      onClick={() => setIsNotifPanelOpen(false)}
                      className="text-slate-400 hover:text-white px-1 text-xs"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {browserNotifPermission === 'default' && (
                  <div className="px-3.5 py-2 bg-indigo-950/50 border-b border-indigo-500/30 flex items-center justify-between gap-2">
                    <span className="text-[11px] text-indigo-200">¿Recibir avisos nativos en el móvil/PC?</span>
                    <button
                      type="button"
                      onClick={requestBrowserNotificationPermission}
                      className="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-extrabold shrink-0"
                    >
                      📲 Activar
                    </button>
                  </div>
                )}

                <div className="max-h-80 overflow-y-auto divide-y divide-slate-800/80">
                  {myNotifications.length > 0 ? (
                    myNotifications.map(n => {
                      const isRemoved = n.eventType === 'removed';
                      const isCompleted = n.eventType === 'completed';
                      const isStarted = n.eventType === 'started';

                      return (
                        <div
                          key={n.id}
                          onClick={() => handleMarkNotifAsRead(n)}
                          className={`p-3.5 text-xs transition cursor-pointer flex items-start justify-between gap-3 ${
                            !n.read ? 'bg-slate-800/70 hover:bg-slate-800' : 'bg-slate-900/40 opacity-75 hover:opacity-100'
                          }`}
                        >
                          <div className="space-y-1 min-w-0 flex-1">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              {!n.read && <span className="w-2 h-2 rounded-full bg-amber-400 shrink-0" />}
                              <span className={`font-extrabold ${
                                isRemoved ? 'text-rose-400' : isCompleted ? 'text-emerald-400' : isStarted ? 'text-amber-300' : 'text-indigo-300'
                              }`}>
                                {n.title}
                              </span>
                            </div>
                            <p className="text-slate-200 text-[11px] leading-relaxed break-words">{n.message}</p>
                            <span className="text-[10px] text-slate-500 block">{formatAddedDate(n.createdAt)}</span>
                          </div>
                        </div>
                      );
                    })
                  ) : (
                    <div className="p-8 text-center space-y-1.5 text-slate-400">
                      <Bell className="w-7 h-7 mx-auto text-slate-600" />
                      <p className="text-xs font-bold text-slate-300">No tienes notificaciones</p>
                      <p className="text-[11px] text-slate-500">Aquí aparecerán los cambios de estado y asignaciones en vivo.</p>
                    </div>
                  )}
                </div>

                {myNotifications.length > 0 && (
                  <div className="p-2.5 bg-slate-950 border-t border-slate-800 flex justify-between items-center">
                    <span className="text-[10px] text-slate-500">Sincronizado en tiempo real</span>
                    <button
                      type="button"
                      onClick={handleClearAllMyNotifications}
                      className="text-[11px] font-bold text-rose-400 hover:text-rose-300 flex items-center gap-1"
                    >
                      <Trash2 className="w-3 h-3" /> Vaciar historial
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      // Tarjeta de Misión del Mercenario (sin mostrar el tiempo de trabajo, solo visible en el panel del Creador)
      const renderWorkerMissionCard = (m, index) => {
        const isFirst = index === 0;
        const isInProgress = m.status === 'En Progreso';
        const isPaused = m.status === 'En Pausa';

        return (
          <div key={m.id} className={`bg-slate-900 rounded-2xl p-4 space-y-3 shadow-xl transition ${isInProgress ? 'border-2 border-amber-500/60' : isPaused ? 'border-2 border-cyan-500/50' : isFirst ? 'border-2 border-indigo-500/50' : 'border border-slate-800'}`}>
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-1.5 flex-wrap">
                <span className={`px-2.5 py-1 rounded text-[11px] font-extrabold uppercase ${isInProgress ? 'bg-amber-500 text-slate-950' : isPaused ? 'bg-cyan-500 text-slate-950' : isFirst ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                  {isInProgress ? '⚡ En Curso' : isPaused ? '⏸️ En Pausa (Cliente Libre)' : isFirst ? '🎯 Siguiente Cuenta' : `⏳ En Cola #${index + 1}`}
                </span>
                {getPriorityBadge(m.priority)}
              </div>

              <div className="flex items-center gap-1.5">
                {!isFirst && (
                  <button onClick={() => handlePrioritizeMission(m)} title="Subir al primer lugar" className="px-2.5 py-1 rounded bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-[11px] font-extrabold flex items-center gap-1 transition">
                    <ArrowUp className="w-3 h-3" /> Priorizar
                  </button>
                )}
                <span className="text-xs font-extrabold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-500/20">
                  Tu Pago: ${m.workerPayUSD} USD
                </span>
              </div>
            </div>

            <div>
              <div className="flex items-center gap-1.5 flex-wrap mb-1.5">{renderMissionTags(m)}</div>
              <h3 className="text-base font-extrabold text-white">{m.missionTitle}</h3>
              <p className="text-xs text-slate-300 mt-1">Cliente: <strong className="text-white">{m.clientName}</strong></p>
            </div>

            {renderMissionChecklistBlock(m)}

            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
              <div className="flex items-center justify-between text-xs text-slate-400">
                <span>Credenciales ({m.loginMethod || 'Kabam ID'})</span>
                <button onClick={() => toggleCredentials(m.id)} className="text-indigo-400 font-bold flex items-center gap-1">
                  {visibleCredentials[m.id] ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}
                </button>
              </div>
              <div className="bg-slate-900 p-2.5 rounded-lg flex items-center justify-between text-xs">
                <span className="font-mono text-slate-200 break-all">{m.accountUser || 'Sin usuario'}</span>
                <button onClick={() => copyToClipboard(m.accountUser, 'Usuario')} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 font-bold shrink-0 ml-2">Copiar</button>
              </div>
              <div className="bg-slate-900 p-2.5 rounded-lg flex items-center justify-between text-xs">
                <span className="font-mono text-amber-300 break-all">{visibleCredentials[m.id] ? (m.accountPass || 'Sin contraseña') : '••••••••••••'}</span>
                <button onClick={() => copyToClipboard(m.accountPass, 'Contraseña')} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200 font-bold shrink-0 ml-2">Copiar</button>
              </div>
            </div>

            {m.instructions && (
              <div className="bg-indigo-950/40 p-3 rounded-xl border border-indigo-500/30 text-xs text-slate-200">
                <strong>Instrucciones:</strong> {m.instructions}
              </div>
            )}

            <div className="space-y-2 pt-1">
              {m.status === 'Pendiente' ? (
                <button onClick={() => handleStartMission(m)} className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm rounded-xl flex items-center justify-center gap-2 transition">
                  <Play className="w-4 h-4 fill-slate-950" /> Empezar Misión
                </button>
              ) : m.status === 'En Pausa' ? (
                <div className="space-y-2">
                  <div className="text-center py-2 px-3 text-xs font-bold text-cyan-300 bg-cyan-500/10 border border-cyan-500/30 rounded-xl">
                    ⏸️ Misión en pausa (El cliente puede entrar)
                  </div>
                  <button onClick={() => handleStartMission(m)} className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-amber-500/20">
                    <Play className="w-4 h-4 fill-slate-950" /> Reanudar Misión
                  </button>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="text-center py-2 text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 rounded-xl">
                    ⚡ Misión actualmente en curso...
                  </div>
                  <button onClick={() => handlePauseMission(m)} className="w-full py-3 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 font-extrabold text-xs rounded-xl flex items-center justify-center gap-2 transition">
                    <Pause className="w-4 h-4" /> ⏸️ Pausar Misión (Avisar que Cliente puede entrar)
                  </button>
                </div>
              )}
              <button onClick={() => { setCompletingMission(m); setCompletionNoteInput(''); }} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm rounded-xl flex items-center justify-center gap-2 transition">
                <Check className="w-4 h-4 stroke-[3]" /> Marcar como Completada
              </button>
            </div>
          </div>
        );
      };

      if (isAuthChecking) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center">
            <div className="animate-spin w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full"></div>
          </div>
        );
      }

      if (!authUser) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-400 flex items-center justify-center mx-auto">
                  <Lock className="w-7 h-7" />
                </div>
                <h1 className="text-2xl font-extrabold text-white">Acceso Seguro</h1>
                <p className="text-xs text-slate-400">
                  Introduce tu correo y contraseña registrados para acceder a tu panel de misiones.
                </p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-2">Correo de usuario</label>
                  <input type="email" required value={emailInput} onChange={(e) => setEmailInput(e.target.value)} placeholder="usuario@misiones.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-2">Contraseña</label>
                  <input type="password" required value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 font-mono tracking-widest text-white text-center text-lg focus:outline-none focus:border-indigo-500" />
                  {loginError && <p className="text-xs text-rose-400 mt-2 font-semibold text-center">{loginError}</p>}
                </div>
                <button type="submit" className="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-lg shadow-indigo-600/30 transition mt-2">Entrar</button>
              </form>
              <div className="pt-2 border-t border-slate-800/80 text-center">
                <button type="button" onClick={() => setShowPwaHint(!showPwaHint)} className="text-[11px] font-bold text-indigo-400 hover:text-indigo-300 flex items-center justify-center gap-1.5 mx-auto"><Smartphone className="w-3.5 h-3.5" /> ¿Cómo instalar como App en tu móvil?</button>
                {showPwaHint && (
                  <div className="mt-2.5 bg-slate-950 border border-slate-800 rounded-xl p-3 text-left text-[11px] text-slate-300 space-y-1.5">
                    <p>📱 <strong className="text-white">En Android:</strong> Toca los 3 puntitos arriba a la derecha y pulsa <strong>"Añadir a pantalla de inicio"</strong>.</p>
                    <p>🍏 <strong className="text-white">En iPhone:</strong> Toca Compartir y selecciona <strong>"Añadir a pantalla de inicio"</strong>.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (!isCreatorSession && !currentIsolatedWorker) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center space-y-4 max-w-sm">
              <Lock className="w-10 h-10 text-rose-500 mx-auto" />
              <h2 className="text-white font-bold">Cuenta no asignada</h2>
              <p className="text-xs text-slate-400">Has iniciado sesión correctamente, pero el administrador aún no ha vinculado tu correo a un perfil de mercenario.</p>
              <button onClick={handleLogout} className="px-4 py-2 bg-slate-800 rounded-xl text-xs font-bold">Cerrar sesión</button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-20">
          {/* BANNER EMERGENTE SUPERIOR DE NOTIFICACIÓN EN VIVO */}
          {liveBannerAlert && (
            <div
              onClick={() => {
                handleMarkNotifAsRead(liveBannerAlert);
                setLiveBannerAlert(null);
              }}
              className="fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-md w-[92%] bg-slate-900/95 backdrop-blur-md border-2 border-amber-500/70 rounded-2xl p-4 shadow-2xl cursor-pointer flex items-start gap-3 animate-bounce"
            >
              <div className="p-2 rounded-xl bg-amber-500/20 text-amber-300 shrink-0">
                <BellRing className="w-5 h-5" />
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-xs font-extrabold text-amber-300">{liveBannerAlert.title}</div>
                <p className="text-xs text-white mt-0.5 line-clamp-2">{liveBannerAlert.message}</p>
              </div>
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  setLiveBannerAlert(null);
                }}
                className="text-slate-400 hover:text-white text-xs"
              >
                ✕
              </button>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-2xl border bg-slate-900 border-indigo-500/50 text-white">
              <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
              <span className="text-sm font-medium">{toastMessage.text}</span>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 pt-6">
            {!isCreatorSession ? (
              <div className="max-w-lg mx-auto space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                  <div className="flex items-center gap-3">
                    <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${getWorkerColorMeta(currentIsolatedWorker?.color).gradient} flex items-center justify-center font-extrabold text-white text-sm shadow`}>
                      {currentIsolatedWorker?.name?.slice(0, 2).toUpperCase() || 'W'}
                    </div>
                    <div>
                      <h2 className="font-extrabold text-white text-base">{currentIsolatedWorker?.name}</h2>
                      <p className="text-xs text-slate-400">{currentIsolatedWorker?.specialty}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    {renderNotificationBell()}
                    <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-300 text-xs font-bold flex items-center gap-1.5 transition">
                      <LogOut className="w-4 h-4" /> Salir
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-3 bg-slate-900 p-1 rounded-xl border border-slate-800 gap-1">
                  <button onClick={() => setWorkerTab('queue')} className={`py-2.5 px-2 rounded-lg text-[11px] sm:text-xs font-bold transition flex items-center justify-center gap-1 ${workerTab === 'queue' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                    <Sword className="w-3.5 h-3.5 shrink-0" /> <span className="truncate">Mis Misiones ({activeWorkerQueue.length})</span>
                  </button>
                  <button onClick={() => setWorkerTab('completed')} className={`py-2.5 px-2 rounded-lg text-[11px] sm:text-xs font-bold transition flex items-center justify-center gap-1 ${workerTab === 'completed' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                    <CheckCircle2 className="w-3.5 h-3.5 shrink-0" /> <span className="truncate">Finalizadas ({completedWorkerMissions.length})</span>
                  </button>
                  <button onClick={() => setWorkerTab('earnings')} className={`py-2.5 px-2 rounded-lg text-[11px] sm:text-xs font-bold transition flex items-center justify-center gap-1 ${workerTab === 'earnings' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                    <DollarSign className="w-3.5 h-3.5 shrink-0" /> <span className="truncate">Ganancias ($)</span>
                  </button>
                </div>

                {workerTab === 'queue' ? (
                  <div className="space-y-4">
                    {activeWorkerQueue.length > 0 ? (
                      <>
                        {renderWorkerMissionCard(activeWorkerQueue[0], 0)}
                        {activeWorkerQueue.length > 1 && (
                          <div className="space-y-3 pt-2">
                            <div className="flex items-center justify-between px-1">
                              <span className="text-xs font-bold uppercase text-slate-400">Próximas en Mis Misiones ({activeWorkerQueue.length - 1}):</span>
                              <span className="text-[11px] text-indigo-400">Puedes priorizarlas o empezarlas a la vez</span>
                            </div>
                            {activeWorkerQueue.slice(1).map((m, idx) => renderWorkerMissionCard(m, idx + 1))}
                          </div>
                        )}
                      </>
                    ) : (
                      <div className="bg-slate-900 p-8 rounded-2xl text-center space-y-2 border border-slate-800">
                        <CheckCircle2 className="w-10 h-10 text-emerald-400 mx-auto" />
                        <h3 className="font-bold text-white text-sm">¡Sin misiones pendientes!</h3>
                        <p className="text-xs text-slate-400">Has completado todas tus cuentas asignadas.</p>
                      </div>
                    )}
                  </div>
                ) : workerTab === 'completed' ? (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between px-1">
                      <h3 className="text-xs font-bold uppercase text-slate-400 flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-emerald-400" /> Misiones Finalizadas ({completedWorkerMissions.length})</h3>
                    </div>
                    {completedWorkerMissions.length > 0 ? (
                      completedWorkerMissions.map((m) => {
                        const displayPay = m.originalWorkerPayUSD !== undefined ? m.originalWorkerPayUSD : m.workerPayUSD;
                        const isPaid = m.isPaidToWorker || Number(m.workerPayUSD) === 0;
                        return (
                          <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5 shadow">
                            <div className="flex items-center justify-between gap-2 flex-wrap">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">✓ Finalizada • {m.monthYear}</span>
                                {renderMissionTags(m)}
                              </div>
                              <span className={`px-2 py-0.5 rounded text-xs font-extrabold ${isPaid ? 'bg-slate-800 text-slate-300' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`}>
                                ${displayPay} USD {isPaid ? '(Ya Liquidado)' : '(Pendiente de cobro)'}
                              </span>
                            </div>
                            <div>
                              <h4 className="font-extrabold text-white text-sm">{m.missionTitle}</h4>
                              <p className="text-xs text-slate-400 mt-0.5">Cliente: <strong className="text-slate-200">{m.clientName}</strong></p>
                            </div>
                            {m.completionNotes && (
                              <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs text-slate-300"><span className="text-slate-400 font-bold">Nota al finalizar:</span> {m.completionNotes}</div>
                            )}
                          </div>
                        );
                      })
                    ) : (
                      <div className="bg-slate-900 p-8 rounded-2xl text-center space-y-2 border border-slate-800">
                        <Clock className="w-10 h-10 text-slate-500 mx-auto" />
                        <h3 className="font-bold text-white text-sm">Aún no hay misiones finalizadas</h3>
                        <p className="text-xs text-slate-400">Cuando completes una misión aparecerá guardada aquí.</p>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-4">
                    {(() => {
                      const currentMonth = getCurrentMonthYear();
                      const currentMonthMissions = completedWorkerMissions.filter(m => m.monthYear === currentMonth);
                      const currentMonthEarnedUSD = currentMonthMissions.reduce((acc, m) => acc + (Number(m.workerPayUSD) || 0), 0);
                      const totalPendingAllMonthsUSD = completedWorkerMissions.reduce((acc, m) => acc + (Number(m.workerPayUSD) || 0), 0);
                      return (
                        <div className="bg-gradient-to-br from-emerald-950/40 to-slate-900 border border-emerald-500/40 rounded-2xl p-5 space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold uppercase text-emerald-300 flex items-center gap-1"><Calendar className="w-4 h-4" /> {currentMonth} (Mes Actual)</span>
                            <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold">{currentMonthMissions.length} completadas este mes</span>
                          </div>
                          <div>
                            <div className="text-3xl font-extrabold text-white">${currentMonthEarnedUSD} <span className="text-sm font-normal text-slate-400">USD</span></div>
                            {totalPendingAllMonthsUSD !== currentMonthEarnedUSD && (
                              <p className="text-xs text-amber-300 font-bold mt-1">Total acumulado sin liquidar (incluyendo meses previos): ${totalPendingAllMonthsUSD} USD</p>
                            )}
                            <p className="text-xs text-slate-400 mt-1">Saldo pendiente de cobro</p>
                          </div>
                        </div>
                      );

                              isSelected
                                ? `${opt.badgeClass} ring-2 ring-white/40 shadow`
                                : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-800'
                            }`}
                          >
                            <span className={`w-3.5 h-3.5 rounded-full bg-gradient-to-br ${opt.gradient} shrink-0`} />
                            <span className="truncate">{opt.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsWorkerModalOpen(false)} className="px-4 py-2 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-xs font-bold rounded-xl text-white">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {completingMission && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="font-extrabold text-white text-base">¿Completar misión?</h3>
                <form onSubmit={handleConfirmCompleteMission} className="space-y-4">
                  <textarea rows={3} value={completionNoteInput} onChange={(e) => setCompletionNoteInput(e.target.value)} placeholder="Notas de finalización..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setCompletingMission(null)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">Cancelar</button>
                    <button type="submit" className="flex-1 py-2 bg-emerald-500 rounded-xl text-xs font-bold text-slate-950">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {missionToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <h3 className="font-bold text-white text-sm">¿Eliminar misión?</h3>
                <div className="flex gap-2">
                  <button onClick={() => setMissionToDelete(null)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">Cancelar</button>
                  <button onClick={handleDeleteMission} className="flex-1 py-2 bg-rose-600 rounded-xl text-xs font-bold text-white">Eliminar</button>
                </div>
              </div>
            </div>
          )}

          {workerToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <h3 className="font-bold text-white text-sm">¿Eliminar al mercenario {workerToDelete.name}?</h3>
                <div className="flex gap-2">
                  <button onClick={() => setWorkerToDelete(null)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">Cancelar</button>
                  <button onClick={handleDeleteWorker} className="flex-1 py-2 bg-rose-600 rounded-xl text-xs font-bold text-white">Eliminar</button>
                </div>
              </div>
            </div>
          )}

          {tagToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <h3 className="font-bold text-white text-sm">¿Eliminar la etiqueta "{tagToDelete.name}"?</h3>
                <p className="text-xs text-slate-400">Se quitará de las misiones que la tengan asignada.</p>
                <div className="flex gap-2">
                  <button onClick={() => setTagToDelete(null)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs font-bold text-slate-300">Cancelar</button>
                  <button onClick={handleDeleteTag} className="flex-1 py-2 bg-rose-600 rounded-xl text-xs font-bold text-white">Eliminar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const createRootInstance = createRoot(document.getElementById('root'));
    createRootInstance.render(<App />);
  </script>
</body>
</html>
